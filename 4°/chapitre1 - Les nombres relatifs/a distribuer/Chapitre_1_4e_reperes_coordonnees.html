<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre 1 (4e) — Repères à coller</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #eee;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .toolbar {
        text-align: center;
        padding: 14px;
    }
    .toolbar button {
        background: #3498db;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
    }
    .toolbar button:hover { background: #2980b9; }
    .toolbar p {
        color: #555;
        font-size: 13px;
        margin: 8px 0 0;
    }
    .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        background: white;
        box-shadow: 0 0 8px rgba(0,0,0,0.2);
        box-sizing: border-box;
        padding: 10mm;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 6mm;
        width: 100%;
        height: 277mm;
    }
    .cell {
        border: 1.5px dashed #888;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3mm;
        box-sizing: border-box;
    }
    .cell svg {
        width: 100%;
        height: 100%;
        background: white;
    }
    @page {
        size: A4;
        margin: 0;
    }
    @media print {
        html, body { background: white; }
        .toolbar { display: none; }
        .page {
            box-shadow: none;
            margin: 0;
            width: 210mm;
            min-height: 297mm;
            padding: 10mm;
        }
    }
</style>
</head>
<body>

<div class="toolbar">
    <button onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
    <p>Astuce : dans la fenêtre d'impression, choisis « Enregistrer au format PDF » comme imprimante.</p>
</div>

<div class="page">
    <div class="grid" id="grid"></div>
</div>

const grid = document.getElementById('grid');
for (let i = 0; i < 6; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = REPERE_SVG;
    grid.appendChild(cell);
}
</script>

</body>
</html>
