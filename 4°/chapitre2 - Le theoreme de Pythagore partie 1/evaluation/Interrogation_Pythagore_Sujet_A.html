<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interrogation - Théorème de Pythagore - Sujet A</title>
<style>
  :root{
    --rouge:#c0392b;
    --bleu:#2980b9;
    --bleu-clair:#d4ebf7;
    --gris:#7f8c8d;
    --encre:#222;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#eef1f4;
    color:var(--encre);
    padding:24px 12px;
  }
  .page{
    max-width:800px;
    margin:0 auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.12);
    padding:36px 44px 44px;
  }
  h1{
    font-size:1.5em;
    color:var(--rouge);
    text-align:center;
    border-bottom:3px solid var(--rouge);
    padding-bottom:10px;
    margin-bottom:4px;
  }
  .souschapitre{
    text-align:center;
    color:var(--gris);
    font-size:0.95em;
    margin-bottom:22px;
  }
  .entete{
    border:2px solid #333;
    border-radius:8px;
    padding:12px 16px;
    line-height:2;
    margin-bottom:22px;
    font-size:0.95em;
  }
  .entete .ligne{
    display:inline-block;
    min-width:60px;
    border-bottom:1px solid #333;
    margin-left:4px;
  }
  .consigne{
    background:#fff3b8;
    border-left:6px solid #f39c12;
    border-radius:6px;
    padding:12px 16px;
    font-size:0.95em;
    margin-bottom:24px;
  }
  h2.exo{
    font-size:1.1em;
    color:var(--bleu);
    text-decoration:underline;
    margin:22px 0 12px;
  }
  .bareme{
    float:right;
    font-weight:normal;
    text-decoration:none;
    color:var(--gris);
    font-size:0.85em;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:8px;
    font-size:1.05em;
  }
  td{
    border:1.5px solid #999;
    padding:10px 14px;
  }
  .calc-cell{
    height:70px;
    vertical-align:top;
    width:50%;
  }
  .q{
    border:1.5px solid #999;
    padding:10px 14px;
    font-size:0.92em;
    vertical-align:top;
    height:56px;
  }
  .q b{ color:var(--bleu); }
  th{
    background:#e8e8e8;
    padding:8px 10px;
    font-size:0.85em;
  }
  footer{
    text-align:center;
    color:#aaa;
    font-size:0.75em;
    margin-top:16px;
  }

  /* ── Notation mathématique (identique à MathsIORI/styles.css) ── */
  .frac, .fraction {
    display: inline-block;
    margin-left: .15em;
    margin-right: .15em;
    vertical-align: middle;
    text-align: center;
  }
  .frac > .num {
    display: block;
    padding: 0 .1em;
    border-bottom: 1px solid black;
    padding-bottom: 2px;
  }
  .frac > .den {
    display: block;
    padding: 0 .1em;
    padding-top: 2px;
  }
  .exposant {
    vertical-align: super;
    font-size: 0.8em;
  }
  .sqrt {
    position: relative;
    display: inline-block;
    border-top: 2px solid black;
    margin-left: .7em;
    padding-left: .2em;
    padding-right: .1em;
  }
  .sqrt:before {
    content: " ";
    position: absolute;
    display: inline-block;
    left: -.65em;
    height: 56%;
    width: .6em;
    border-right: 2px solid black;
    border-bottom: 2.5px solid black;
    transform-origin: top right;
    transform: rotate(55deg) skew(50deg);
  }

  @media print{
    @page{ margin:10mm; }
    body{ background:#fff; padding:0; }
    .page{ box-shadow:none; border-radius:0; padding:4mm; }
  }
  .toolbar{ max-width:800px; margin:0 auto 12px; text-align:center; }
  .toolbar button{ font-size:1em; padding:10px 22px; border:none; border-radius:6px; background:#2980b9; color:#fff; cursor:pointer; }
  .toolbar button:hover{ background:#1f6391; }
  @media print{ .toolbar{ display:none !important; } }

  .badge-correction{ display:block; text-align:center; margin:0 auto 24px; background:var(--rouge); color:#fff; font-weight:bold;
    letter-spacing:0.06em; width:fit-content; padding:4px 18px; border-radius:20px; font-size:0.85em; }
  .rep{ color:var(--rouge); font-weight:bold; }
  .calcs{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px 20px; font-size:1.15em; margin:8px 0 6px; }
  .blank{ display:inline-block; min-width:70px; border-bottom:1px dotted #333; }
  table.tri td{ text-align:center; vertical-align:middle; width:33.3%; }
  table.tri td.eg{ height:56px; font-size:1.1em; }
  .ex3{ display:flex; gap:24px; align-items:flex-start; }
  .ex3 .calc div{ line-height:2.1; }
  svg{ display:block; margin:0 auto; }
  @media print{ table, .ex3{ break-inside:avoid; } }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">🖨️ Imprimer</button></div>
<div class="page">

</div>
</body>
</html>
