<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Coordonnées de points dans un repère</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-anim:disabled { background: #90caf9; cursor: not-allowed; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #f5f5f5; border-left: 5px solid #555;
        padding: 12px 18px; margin-bottom: 8px; color: #222;
        font-size: 16px; font-weight: 500; min-height: 30px;
        display: block; line-height: 1.6; text-align: center;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
        max-width: 520px; margin: 0 auto;
    }
</style>
</head>
<body>

<div class="step-box"><span id="stepText">Cliquez sur « Étape suivante » pour découvrir les coordonnées des points <span style="color:red;">A</span>, <span style="color:blue;">B</span> et <span style="color:green;">C</span>.</span></div>

<div class="svg-wrap">
    <svg width="500" height="500" viewBox="0 0 500 500" style="max-width:100%; height:auto; display:block; margin:0 auto;" xmlns="http://www.w3.org/2000/svg">
        <!-- Axes -->
        <line x1="50" y1="250" x2="450" y2="250" stroke="black" stroke-width="2"/>
        <polygon points="450,250 440,245 440,255" fill="black"/>
        <text x="460" y="255" font-size="14">x</text>

        <line x1="250" y1="450" x2="250" y2="50" stroke="black" stroke-width="2"/>
        <polygon points="250,50 245,60 255,60" fill="black"/>
        <text x="255" y="45" font-size="14">y</text>

        <!-- Origine -->
        <text x="260" y="265" font-size="14" font-weight="bold">O</text>

        <!-- Graduations axe x -->
        <line x1="100" y1="245" x2="100" y2="255" stroke="black" stroke-width="1"/>
        <text x="100" y="270" text-anchor="middle" font-size="12">−3</text>

        <line x1="150" y1="245" x2="150" y2="255" stroke="black" stroke-width="1"/>
        <text x="150" y="270" text-anchor="middle" font-size="12">−2</text>

        <line x1="200" y1="245" x2="200" y2="255" stroke="black" stroke-width="1"/>
        <text x="200" y="270" text-anchor="middle" font-size="12">−1</text>

        <line x1="300" y1="245" x2="300" y2="255" stroke="black" stroke-width="1"/>
        <text x="300" y="270" text-anchor="middle" font-size="12">1</text>

        <line x1="350" y1="245" x2="350" y2="255" stroke="black" stroke-width="1"/>
        <text x="350" y="270" text-anchor="middle" font-size="12">2</text>

        <line x1="400" y1="245" x2="400" y2="255" stroke="black" stroke-width="1"/>
        <text x="400" y="270" text-anchor="middle" font-size="12">3</text>

        <!-- Graduations axe y -->
        <line x1="245" y1="350" x2="255" y2="350" stroke="black" stroke-width="1"/>
        <text x="235" y="355" text-anchor="end" font-size="12">−2</text>

        <line x1="245" y1="300" x2="255" y2="300" stroke="black" stroke-width="1"/>
        <text x="235" y="305" text-anchor="end" font-size="12">−1</text>

        <line x1="245" y1="200" x2="255" y2="200" stroke="black" stroke-width="1"/>
        <text x="235" y="205" text-anchor="end" font-size="12">1</text>

        <line x1="245" y1="150" x2="255" y2="150" stroke="black" stroke-width="1"/>
        <text x="235" y="155" text-anchor="end" font-size="12">2</text>

        <line x1="245" y1="100" x2="255" y2="100" stroke="black" stroke-width="1"/>
        <text x="235" y="105" text-anchor="end" font-size="12">3</text>

        <!-- Point A (rouge) : croix + nom (étape 1), coordonnées + pointillés (étape 2) -->
        <g id="pointA" opacity="0">
            <line x1="293" y1="193" x2="307" y2="207" stroke="red" stroke-width="2.5"/>
            <line x1="307" y1="193" x2="293" y2="207" stroke="red" stroke-width="2.5"/>
            <text x="315" y="200" font-size="14" font-weight="bold" fill="red">A</text>
        </g>
        <text id="coordsA" x="330" y="200" font-size="14" fill="red" opacity="0">(1 ; 1)</text>
        <g id="guideA" opacity="0">
            <line x1="300" y1="200" x2="300" y2="250" stroke="red" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="300" y1="200" x2="250" y2="200" stroke="red" stroke-width="1" stroke-dasharray="3,3"/>
        </g>

        <!-- Point B (bleu) : croix + nom (étape 3), coordonnées + pointillés (étape 4) -->
        <g id="pointB" opacity="0">
            <line x1="93" y1="143" x2="107" y2="157" stroke="blue" stroke-width="2.5"/>
            <line x1="107" y1="143" x2="93" y2="157" stroke="blue" stroke-width="2.5"/>
            <text x="115" y="150" font-size="14" font-weight="bold" fill="blue">B</text>
        </g>
        <text id="coordsB" x="130" y="150" font-size="14" fill="blue" opacity="0">(−3 ; 2)</text>
        <g id="guideB" opacity="0">
            <line x1="100" y1="150" x2="100" y2="250" stroke="blue" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="100" y1="150" x2="250" y2="150" stroke="blue" stroke-width="1" stroke-dasharray="3,3"/>
        </g>

        <!-- Point C (vert) : croix + nom (étape 5), coordonnées + pointillés (étape 6) -->
        <g id="pointC" opacity="0">
            <line x1="343" y1="293" x2="357" y2="307" stroke="green" stroke-width="2.5"/>
            <line x1="357" y1="293" x2="343" y2="307" stroke="green" stroke-width="2.5"/>
            <text x="365" y="300" font-size="14" font-weight="bold" fill="green">C</text>
        </g>
        <text id="coordsC" x="380" y="300" font-size="14" fill="green" opacity="0">(2 ; −1)</text>
        <g id="guideC" opacity="0">
            <line x1="350" y1="300" x2="350" y2="250" stroke="green" stroke-width="1" stroke-dasharray="3,3"/>
            <line x1="350" y1="300" x2="250" y2="300" stroke="green" stroke-width="1" stroke-dasharray="3,3"/>
        </g>
    </svg>
</div>

<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>◀ Étape précédente</button>
    <button class="btn-anim" onclick="nextStep()">Étape suivante ▶</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">⏵ Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer ↺</button>
</div>

<script>
const texts = [
    "Cliquez sur « Étape suivante » pour découvrir les coordonnées des points <span style='color:red;'>A</span>, <span style='color:blue;'>B</span> et <span style='color:green;'>C</span>.",
    "Voici le point <span style='color:red;'>A</span>. D'après sa position sur les axes, quelles sont ses coordonnées ?",
    "Le point <span style='color:red;'>A</span> a pour coordonnées <span style='color:red;'>(1 ; 1)</span>.",
    "Voici le point <span style='color:blue;'>B</span>. Quelles sont ses coordonnées ?",
    "Le point <span style='color:blue;'>B</span> a pour coordonnées <span style='color:blue;'>(−3 ; 2)</span>.",
    "Voici le point <span style='color:green;'>C</span>. Quelles sont ses coordonnées ?",
    "Le point <span style='color:green;'>C</span> a pour coordonnées <span style='color:green;'>(2 ; −1)</span>."
];
const MAX_STEP = texts.length - 1;
let step = 0;
let autoTimer = null;

const ALL_IDS = ['pointA','coordsA','guideA','pointB','coordsB','guideB','pointC','coordsC','guideC'];

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

function hideAll() {
    ALL_IDS.forEach(id => setOpacity(id, 0));
}

// Applique uniquement la nouveauté de l'étape n
function applyStepChanges(n) {
    document.getElementById('stepText').innerHTML = texts[n];
    if (n === 1) setOpacity('pointA', 1);
    if (n === 2) { setOpacity('coordsA', 1); setOpacity('guideA', 1); }
    if (n === 3) setOpacity('pointB', 1);
    if (n === 4) { setOpacity('coordsB', 1); setOpacity('guideB', 1); }
    if (n === 5) setOpacity('pointC', 1);
    if (n === 6) { setOpacity('coordsC', 1); setOpacity('guideC', 1); }
}

function updateButtons() {
    const btnPrec = document.getElementById('btnPrec');
    if (btnPrec) btnPrec.disabled = (step <= 0);
}

function advanceStep() {
    if (step >= MAX_STEP) return;
    step++;
    applyStepChanges(step);
    updateButtons();
}

// Reconstruit intégralement l'état visuel pour l'étape n (utilisé par « précédent »)
function goToStep(n) {
    if (n < 0) n = 0;
    if (n > MAX_STEP) n = MAX_STEP;
    hideAll();
    document.getElementById('stepText').innerHTML = texts[0];
    for (let i = 1; i <= n; i++) applyStepChanges(i);
    step = n;
    updateButtons();
}

function nextStep() {
    stopAuto();
    advanceStep();
}

function prevStep() {
    stopAuto();
    if (step > 0) goToStep(step - 1);
}

function resetAnimation() {
    stopAuto();
    hideAll();
    step = 0;
    document.getElementById('stepText').innerHTML = texts[0];
    updateButtons();
}

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= MAX_STEP) resetAnimation();
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= MAX_STEP) { stopAuto(); return; }
        advanceStep();
    }, 2400);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}
</script>
<script>
/* === Redimensionnement automatique (hauteur) === */
(function () {
    if (window.parent === window) return;
    function postH() {
        window.parent.postMessage({ type: 'iframe-resize', height: document.body.scrollHeight }, '*');
    }
    if (window.ResizeObserver) new ResizeObserver(postH).observe(document.body);
    window.addEventListener('load', postH);
    if (document.readyState !== 'loading') postH(); else document.addEventListener('DOMContentLoaded', postH);
})();
</script>
</body>
</html>
