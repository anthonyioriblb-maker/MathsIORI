<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation : Symétrique d'une figure par rapport à un point</title>
    <style>
        html, body { margin:0; padding:0; background:#fafafa; overflow:hidden;
               font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        .container { width:1122px; margin:0 auto; padding:16px 30px 20px; box-sizing:border-box; }
        .step-text {
            background:#e3f2fd; border-left:5px solid #2196f3;
            padding:15px 20px; margin:0 0 15px; color:#1565c0;
            font-size:17px; min-height:60px; font-weight:500;
            display:flex; align-items:center; box-sizing:border-box;
        }
        svg { display:block; margin:0 auto; background:#fafafa;
              border:2px solid #ddd; border-radius:8px; }
        .controls { text-align:center; margin:0 0 16px; }
        button {
            background:#3498db; color:white; border:none;
            padding:14px 28px; margin:8px; border-radius:6px;
            cursor:pointer; font-size:17px; font-weight:bold;
            box-shadow:0 2px 5px rgba(0,0,0,0.2); transition:all 0.3s;
        }
        button:hover { background:#2980b9; transform:translateY(-2px); }
        button:disabled { background:#bdc3c7; cursor:not-allowed; transform:none; }
        button.reset { background:#e74c3c; }
        button.reset:hover { background:#c0392b; }
        button.prev { background:#7f8c8d; }
        button.prev:hover { background:#636e72; }
    </style>
</head>
<body>
<div class="container">
    <div class="step-text" id="stepText">
        Cliquez sur « Étape suivante » pour voir la construction étape par étape.
    </div>

    <div class="controls">
        <button id="prevBtn" class="prev" onclick="goPrev()" disabled>◀ Précédent</button>
        <button id="nextBtn" onclick="nextStep()">▶ Étape suivante</button>
        <button class="reset" onclick="resetAnimation()">🔄 Recommencer</button>
    </div>

    <!--
    ═══════════════════════════════════════════════════════
    GÉOMÉTRIE (reproduit la figure de l'image 5-23 : une droite (AB),
    un triangle CDE, un cercle de centre F, et un point O)
    A=(191,40) B=(742,179) C=(174,209) D=(40,386) E=(209,362)
    F=(420,167) r=108   O=(565,434)
    Symétriques (2O - P) : A'=(939,828) B'=(388,689) C'=(956,659)
    D'=(1090,482) E'=(921,506) F'=(710,701)
    ═══════════════════════════════════════════════════════
    -->

    <svg id="anim" width="1062" height="839" viewBox="0 0 1250 988">
    <g transform="translate(60,60)">

        <!-- ══ FIGURE DE DÉPART (toujours visible) ══ -->
        <line x1="108" y1="19" x2="797" y2="193" stroke="#999" stroke-width="2.5"/>
        <path d="M174,209 L40,386 L209,362 Z" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
        <circle cx="420" cy="167" r="108" fill="none" stroke="#999" stroke-width="2.5"/>

        <g stroke="#2c3e50" stroke-width="3">
            <g><line x1="184" y1="33" x2="198" y2="47"/><line x1="198" y1="33" x2="184" y2="47"/></g>
            <g><line x1="735" y1="172" x2="749" y2="186"/><line x1="749" y1="172" x2="735" y2="186"/></g>
            <g><line x1="167" y1="202" x2="181" y2="216"/><line x1="181" y1="202" x2="167" y2="216"/></g>

            <g><line x1="202" y1="355" x2="216" y2="369"/><line x1="216" y1="355" x2="202" y2="369"/></g>
            <g><line x1="413" y1="160" x2="427" y2="174"/><line x1="427" y1="160" x2="413" y2="174"/></g>
            <g><line x1="558" y1="427" x2="572" y2="441"/><line x1="572" y1="427" x2="558" y2="441"/></g>
        </g>
        <circle cx="565" cy="434" r="5" fill="none" stroke="#2c3e50" stroke-width="1.5"/>

        <g font-size="22" font-weight="bold" fill="#2c3e50">
            <text x="176" y="30">A</text>
            <text x="750" y="164">B</text>
            <text x="160" y="195">C</text>
            <text x="8" y="415">D</text>
            <text x="223" y="378">E</text>
            <text x="434" y="155">F</text>
            <text x="579" y="422">O</text>
        </g>

        <!-- ══ DEMI-DROITES DE CONSTRUCTION (P, O, P' alignés) — couleur de l'objet final ══ -->
        <g id="constructionLines" stroke-width="1.5" stroke-dasharray="6,4">
            <line id="rayA" x1="191" y1="40"  x2="191" y2="40"  opacity="0" stroke="#2980b9"/>
            <line id="rayB" x1="742" y1="179" x2="742" y2="179" opacity="0" stroke="#2980b9"/>
            <line id="rayC" x1="174" y1="209" x2="174" y2="209" opacity="0" stroke="#27ae60"/>
            <line id="rayD" x1="40"  y1="386" x2="40"  y2="386" opacity="0" stroke="#27ae60"/>
            <line id="rayE" x1="209" y1="362" x2="209" y2="362" opacity="0" stroke="#27ae60"/>
            <line id="rayF" x1="420" y1="167" x2="420" y2="167" opacity="0" stroke="#8e44ad"/>
        </g>

        <!-- ══ RÈGLE + CRAYON réutilisés pour tracer chaque demi-droite ══ -->
        <g id="ruler2" opacity="0">
            <rect id="rulerBody" x="-20" y="-20" width="100" height="20" rx="3"
                  fill="rgba(255,206,84,0.55)" stroke="#e0a800" stroke-width="2"/>
            <g id="rulerTicks"></g>
            <line id="rulerEdge" x1="-20" y1="0" x2="80" y2="0" stroke="#c98f00" stroke-width="2"/>
        </g>
        <g id="pencil2" opacity="0">
            <g transform="rotate(-40)">
                <rect x="-5" y="-40" width="10" height="27" rx="2" fill="#ff4444" stroke="#cc0000" stroke-width="2"/>
                <polygon points="-5,-13 5,-13 0,-1" fill="#333"/>
                <circle cx="0" cy="-1" r="2.5" fill="#000"/>
            </g>
        </g>

        <!-- ══ COMPAS (pointe fixe en O, écartement variable) ══ -->
        <g id="compass" opacity="0">
            <circle id="compassHinge" cx="0" cy="0" r="10"
                    fill="#ff8c00" stroke="#cc6600" stroke-width="2"/>
            <line id="compassPointBranch" x1="0" y1="0" x2="-5" y2="60"
                  stroke="#ff8c00" stroke-width="6"/>
            <circle id="compassPointTip" cx="-5" cy="60" r="6"
                    fill="#222" stroke="#000" stroke-width="2"/>
            <line id="compassPencilBranch" x1="0" y1="0" x2="5" y2="60"
                  stroke="#ff8c00" stroke-width="6"/>
            <rect id="compassPencilBody" x="0" y="50" width="10" height="25"
                  fill="#ff4444" stroke="#cc0000" stroke-width="2" rx="2"/>
            <polygon id="compassPencilTip" points="5,75 0,85 10,85" fill="#333"/>
            <circle id="compassPencilPoint" cx="5" cy="85" r="3" fill="#000"/>
        </g>

        <!-- ══ POINTS SYMÉTRIQUES (révélés progressivement) — couleur de l'objet final ══ -->
        <g id="primePoints" stroke-width="3">
            <g id="pA" opacity="0" stroke="#2980b9"><line x1="932" y1="821" x2="946" y2="835"/><line x1="946" y1="821" x2="932" y2="835"/></g>
            <g id="pB" opacity="0" stroke="#2980b9"><line x1="381" y1="682" x2="395" y2="696"/><line x1="395" y1="682" x2="381" y2="696"/></g>
            <g id="pC" opacity="0" stroke="#27ae60"><line x1="949" y1="652" x2="963" y2="666"/><line x1="963" y1="652" x2="949" y2="666"/></g>
            <g id="pD" opacity="0" stroke="#27ae60"><line x1="1083" y1="475" x2="1097" y2="489"/><line x1="1097" y1="475" x2="1083" y2="489"/></g>
            <g id="pE" opacity="0" stroke="#27ae60"><line x1="914" y1="499" x2="928" y2="513"/><line x1="928" y1="499" x2="914" y2="513"/></g>
            <g id="pF" opacity="0" stroke="#8e44ad"><line x1="703" y1="694" x2="717" y2="708"/><line x1="717" y1="694" x2="703" y2="708"/></g>
        </g>
        <g id="primeLabels" font-size="22" font-weight="bold">
            <text id="lA" x="953" y="814" opacity="0" fill="#2980b9">A'</text>
            <text id="lB" x="402" y="675" opacity="0" fill="#2980b9">B'</text>
            <text id="lC" x="970" y="645" opacity="0" fill="#27ae60">C'</text>
            <text id="lD" x="1104" y="468" opacity="0" fill="#27ae60">D'</text>
            <text id="lE" x="935" y="492" opacity="0" fill="#27ae60">E'</text>
            <text id="lF" x="724" y="687" opacity="0" fill="#8e44ad">F'</text>
        </g>

        <!-- ══ FIGURE SYMÉTRIQUE — une couleur par objet : droite (bleu), triangle (vert), cercle (violet) ══ -->
        <line id="lineePrime" x1="997" y1="843" x2="997" y2="843" stroke="#2980b9" stroke-width="2.5" opacity="0"/>
        <path id="trianglePrime" d="" fill="none" stroke="#27ae60" stroke-width="2.5" opacity="0"/>
        <path id="circleSweepPath" d="" fill="none" stroke="#8e44ad" stroke-width="2.5" opacity="0"/>
        <circle id="circlePrime" cx="710" cy="701" r="0" fill="none" stroke="#8e44ad" stroke-width="2.5" opacity="0"/>

    </g>
    </svg>
</div>

<script>
const O = {x:565, y:434};
const A = {x:191, y:40},  B = {x:742, y:179};
const C = {x:174, y:209}, D = {x:40,  y:386}, E = {x:209, y:362};
const F = {x:420, y:167}, R = 108;

function reflect(P) { return {x: 2*O.x - P.x, y: 2*O.y - P.y}; }
const Ap = reflect(A), Bp = reflect(B), Cp = reflect(C), Dp = reflect(D), Ep = reflect(E), Fp = reflect(F);

let currentStep = 0;

const stepTexts = [
    'Cliquez sur « Étape suivante » pour voir la construction étape par étape.',
    '<strong style="color:#2980b9;font-size:20px;">1.</strong> Au compas (pointe en O), je construis les symétriques de A et de B, puis je trace la droite (A\'B\').',
    '<strong style="color:#27ae60;font-size:20px;">2.</strong> Je construis les symétriques de C, D et E, puis je trace le triangle D\'C\'E\'.',
    '<strong style="color:#8e44ad;font-size:20px;">3.</strong> Je construis le symétrique de F. Au compas, je vais chercher l\'écartement du cercle de départ et je le reproduis à partir de F\'. ✓'
];

const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = id => document.getElementById(id);

// ── Compas (pointe fixe en O) ──────────────────────────────
function setCompass(tip, pen) {
    const hx = (tip.x + pen.x) / 2, hy = (tip.y + pen.y) / 2;
    el('compassHinge').setAttribute('cx', hx);
    el('compassHinge').setAttribute('cy', hy);
    el('compassPointBranch').setAttribute('x1', hx);
    el('compassPointBranch').setAttribute('y1', hy);
    el('compassPointBranch').setAttribute('x2', tip.x);
    el('compassPointBranch').setAttribute('y2', tip.y);
    el('compassPointTip').setAttribute('cx', tip.x);
    el('compassPointTip').setAttribute('cy', tip.y);
    el('compassPencilBranch').setAttribute('x1', hx);
    el('compassPencilBranch').setAttribute('y1', hy);
    el('compassPencilBranch').setAttribute('x2', pen.x);
    el('compassPencilBranch').setAttribute('y2', pen.y);
    const ang = Math.atan2(pen.y - hy, pen.x - hx) * 180 / Math.PI + 90;
    el('compassPencilBody').setAttribute('transform',
        `translate(${pen.x},${pen.y - 15}) rotate(${ang})`);
    el('compassPencilTip').setAttribute('transform',
        `translate(${pen.x - 5},${pen.y}) rotate(${ang} 5 0)`);
    el('compassPencilPoint').setAttribute('cx', pen.x);
    el('compassPencilPoint').setAttribute('cy', pen.y);
}

let curPen = {x: O.x, y: O.y};

async function compassOpen(target, duration) {
    const from = {x: curPen.x, y: curPen.y};
    const N = 30;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        curPen = { x: from.x + (target.x - from.x) * t, y: from.y + (target.y - from.y) * t };
        setCompass(O, curPen);
        await sleep(duration / N);
    }
}

async function compassPivot(radius, a1, a2, duration) {
    const N = 60;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const angle = a1 + (a2 - a1) * t;
        curPen = { x: O.x + radius * Math.cos(angle), y: O.y + radius * Math.sin(angle) };
        setCompass(O, curPen);
        await sleep(duration / N);
    }
}

// ── Compas généralisé (pointe mobile) — pour aller chercher un écartement
//    ailleurs qu'en O, puis le reproduire à partir d'un autre centre ──────
async function compassOpenAt(tip, target, duration) {
    const from = { x: curPen.x, y: curPen.y };
    const N = 30;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        curPen = { x: from.x + (target.x - from.x) * t, y: from.y + (target.y - from.y) * t };
        setCompass(tip, curPen);
        await sleep(duration / N);
    }
}

// Transporte le compas d'une position (tip1,pen1) à une autre (tip2,pen2) :
// utilisé soit pour déplacer le compas rigidement (écartement conservé,
// tip2-pen2 = tip1-pen1 translatés), soit pour l'amener ailleurs.
async function compassMove(tip1, pen1, tip2, pen2, duration) {
    const N = 40;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const tip = { x: tip1.x + (tip2.x - tip1.x) * t, y: tip1.y + (tip2.y - tip1.y) * t };
        const pen = { x: pen1.x + (pen2.x - pen1.x) * t, y: pen1.y + (pen2.y - pen1.y) * t };
        setCompass(tip, pen);
        await sleep(duration / N);
    }
    curPen = { x: pen2.x, y: pen2.y };
}

// Trace un cercle complet (tour de crayon) autour d'une pointe arbitraire,
// en dessinant progressivement le chemin dans pathEl.
async function compassSweepAt(tip, radius, a1, a2, duration, pathEl) {
    const N = 90;
    let d = '';
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const angle = a1 + (a2 - a1) * t;
        const px = tip.x + radius * Math.cos(angle);
        const py = tip.y + radius * Math.sin(angle);
        setCompass(tip, { x: px, y: py });
        if (i === 0) {
            d = `M ${px.toFixed(1)} ${py.toFixed(1)}`;
            pathEl.style.opacity = '1';
        } else {
            d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
        }
        pathEl.setAttribute('d', d);
        await sleep(duration / N);
    }
    curPen = { x: tip.x + radius * Math.cos(a2), y: tip.y + radius * Math.sin(a2) };
}

// ── Règle : trace la demi-droite (P,O) prolongée, comme pour l'étape 1 ──
const RAY_EXT = 60; // prolongement de la demi-droite de chaque côté

function layoutRuler(length) {
    el('rulerBody').setAttribute('x', -RAY_EXT);
    el('rulerBody').setAttribute('width', length + 2 * RAY_EXT);
    el('rulerEdge').setAttribute('x1', -RAY_EXT);
    el('rulerEdge').setAttribute('x2', length + RAY_EXT);
    const ticks = el('rulerTicks');
    while (ticks.firstChild) ticks.removeChild(ticks.firstChild);
    for (let x = -RAY_EXT + 20; x <= length + RAY_EXT - 20; x += 40) {
        const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        tick.setAttribute('x1', x); tick.setAttribute('y1', -20);
        tick.setAttribute('x2', x); tick.setAttribute('y2', -4);
        tick.setAttribute('stroke', '#e0a800'); tick.setAttribute('stroke-width', '1.2');
        ticks.appendChild(tick);
    }
}

async function drawRayWithRuler(rayEl, P, Pp, duration) {
    const dx = Pp.x - P.x, dy = Pp.y - P.y;
    const length = Math.hypot(dx, dy);
    const ux = dx / length, uy = dy / length;
    const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    layoutRuler(length);
    const ruler = el('ruler2'), pencil = el('pencil2');
    ruler.setAttribute('transform', `translate(${P.x},${P.y}) rotate(${angleDeg})`);
    ruler.style.opacity = '1';
    await sleep(350);

    // la demi-droite dépasse un peu P et Pp de chaque côté
    const start = { x: P.x - ux * RAY_EXT,  y: P.y - uy * RAY_EXT };
    const end   = { x: Pp.x + ux * RAY_EXT, y: Pp.y + uy * RAY_EXT };
    rayEl.setAttribute('x1', start.x); rayEl.setAttribute('y1', start.y);
    rayEl.setAttribute('x2', start.x); rayEl.setAttribute('y2', start.y);
    rayEl.style.opacity = '1';
    pencil.style.opacity = '1';
    const N = 40;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const cx = start.x + (end.x - start.x) * t, cy = start.y + (end.y - start.y) * t;
        rayEl.setAttribute('x2', cx); rayEl.setAttribute('y2', cy);
        pencil.setAttribute('transform', `translate(${cx},${cy})`);
        await sleep(duration / N);
    }
    pencil.style.opacity = '0';
    await sleep(250);
    ruler.style.opacity = '0';
    await sleep(200);
}

async function reflectPoint(P, Pp, crossId, labelId, rayId) {
    // 1) à la règle, on trace d'abord la demi-droite (P,O) prolongée
    el('compass').style.opacity = '0';
    await drawRayWithRuler(el(rayId), P, Pp, 850);
    // 2) puis au compas, on reporte l'écartement pour trouver le point symétrique
    el('compass').style.opacity = '1';
    await compassOpen(P, 700);
    await sleep(120);
    const radius = Math.hypot(P.x - O.x, P.y - O.y);
    const angP = Math.atan2(P.y - O.y, P.x - O.x);
    await compassPivot(radius, angP, angP + Math.PI, 1000);
    el(crossId).style.opacity = '1';
    el(labelId).style.opacity = '1';
    await sleep(200);
}

// ── Tracés progressifs (figure symétrique finale) ──────────
async function growLine(lineEl, x1, y1, x2, y2, duration) {
    lineEl.setAttribute('x1', x1); lineEl.setAttribute('y1', y1);
    lineEl.setAttribute('x2', x1); lineEl.setAttribute('y2', y1);
    lineEl.style.opacity = '1';
    const N = 40;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        lineEl.setAttribute('x2', x1 + (x2 - x1) * t);
        lineEl.setAttribute('y2', y1 + (y2 - y1) * t);
        await sleep(duration / N);
    }
}

async function growPath(pathEl, pts, duration) {
    pathEl.style.opacity = '1';
    const segN = 25;
    const total = pts.length - 1;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    pathEl.setAttribute('d', d);
    for (let s = 0; s < total; s++) {
        const p1 = pts[s], p2 = pts[s+1];
        for (let i = 1; i <= segN; i++) {
            const t = i / segN;
            const cx = p1.x + (p2.x - p1.x) * t;
            const cy = p1.y + (p2.y - p1.y) * t;
            pathEl.setAttribute('d', d + ` L ${cx.toFixed(1)} ${cy.toFixed(1)}`);
            await sleep(duration / (segN * total));
        }
        d += ` L ${p2.x} ${p2.y}`;
        pathEl.setAttribute('d', d);
    }
}

async function growCircle(circleEl, cx, cy, targetR, duration) {
    circleEl.setAttribute('cx', cx);
    circleEl.setAttribute('cy', cy);
    circleEl.style.opacity = '1';
    const N = 30;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        circleEl.setAttribute('r', targetR * t);
        await sleep(duration / N);
    }
}

// Construction du cercle symétrique : on va chercher l'écartement (le rayon)
// sur le cercle de départ, puis on le reproduit à partir de F'.
async function drawCircleWithCompass(F, Fp, R) {
    // 1) on transporte le compas (écartement inchangé) jusqu'au centre F du cercle de départ
    const pen1 = { x: curPen.x + (F.x - O.x), y: curPen.y + (F.y - O.y) };
    await compassMove(O, curPen, F, pen1, 700);
    await sleep(150);

    // 2) on ouvre le compas jusqu'au bord du cercle de départ : on va chercher l'écartement R
    const edgeStart = { x: F.x + R, y: F.y };
    await compassOpenAt(F, edgeStart, 700);
    await sleep(350);

    // 3) on transporte le compas (écartement R conservé) du centre F vers le centre F'
    const edgeEnd = { x: Fp.x + R, y: Fp.y };
    await compassMove(F, edgeStart, Fp, edgeEnd, 900);
    await sleep(200);

    // 4) on trace le cercle symétrique en tournant tout autour de F'
    await compassSweepAt(Fp, R, 0, 2 * Math.PI, 1500, el('circleSweepPath'));
    await sleep(150);

    // 5) on révèle le cercle final, on efface le tracé du compas et on range le compas
    el('circlePrime').setAttribute('r', R);
    el('circlePrime').style.opacity = '1';
    el('circleSweepPath').style.opacity = '0';
    el('compass').style.opacity = '0';
}

// ── Affichage instantané de l'état final d'une étape (pour Précédent) ──
function polygonPath(pts) {
    return 'M ' + pts.map(p => p.x + ' ' + p.y).join(' L ');
}

function rayEndpoints(P, Pp) {
    const dx = Pp.x - P.x, dy = Pp.y - P.y;
    const length = Math.hypot(dx, dy);
    const ux = dx / length, uy = dy / length;
    return {
        start: { x: P.x - ux * RAY_EXT,  y: P.y - uy * RAY_EXT },
        end:   { x: Pp.x + ux * RAY_EXT, y: Pp.y + uy * RAY_EXT }
    };
}

function setRayFinal(rayEl, P, Pp) {
    const r = rayEndpoints(P, Pp);
    rayEl.setAttribute('x1', r.start.x); rayEl.setAttribute('y1', r.start.y);
    rayEl.setAttribute('x2', r.end.x);   rayEl.setAttribute('y2', r.end.y);
    rayEl.style.opacity = '1';
}

const LINE_P1 = {x:997, y:843}, LINE_P2 = {x:330, y:674};

function renderStep(n) {
    ['compass','ruler2','pencil2','pA','pB','pC','pD','pE','pF','lineePrime','trianglePrime','circlePrime',
     'circleSweepPath','rayA','rayB','rayC','rayD','rayE','rayF'].forEach(id => {
        el(id).style.opacity = '0';
    });
    ['lA','lB','lC','lD','lE','lF'].forEach(id => { el(id).style.opacity = '0'; });
    el('trianglePrime').setAttribute('d', '');
    el('circlePrime').setAttribute('r', '0');
    el('circleSweepPath').setAttribute('d', '');
    curPen = {x: O.x, y: O.y};
    setCompass(O, O);

    if (n >= 1) {
        setRayFinal(el('rayA'), A, Ap);
        setRayFinal(el('rayB'), B, Bp);
        el('pA').style.opacity = '1'; el('lA').style.opacity = '1';
        el('pB').style.opacity = '1'; el('lB').style.opacity = '1';
        el('lineePrime').setAttribute('x1', LINE_P1.x); el('lineePrime').setAttribute('y1', LINE_P1.y);
        el('lineePrime').setAttribute('x2', LINE_P2.x); el('lineePrime').setAttribute('y2', LINE_P2.y);
        el('lineePrime').style.opacity = '1';
        el('compass').style.opacity = '1';
        curPen = {x: Bp.x, y: Bp.y};
        setCompass(O, curPen);
    }
    if (n >= 2) {
        setRayFinal(el('rayC'), C, Cp);
        setRayFinal(el('rayD'), D, Dp);
        setRayFinal(el('rayE'), E, Ep);
        el('pC').style.opacity = '1'; el('lC').style.opacity = '1';
        el('pD').style.opacity = '1'; el('lD').style.opacity = '1';
        el('pE').style.opacity = '1'; el('lE').style.opacity = '1';
        el('trianglePrime').setAttribute('d', polygonPath([Cp, Dp, Ep, Cp]));
        el('trianglePrime').style.opacity = '1';
        curPen = {x: Ep.x, y: Ep.y};
        setCompass(O, curPen);
    }
    if (n >= 3) {
        setRayFinal(el('rayF'), F, Fp);
        el('pF').style.opacity = '1'; el('lF').style.opacity = '1';
        el('circlePrime').setAttribute('cx', Fp.x); el('circlePrime').setAttribute('cy', Fp.y);
        el('circlePrime').setAttribute('r', R);
        el('circlePrime').style.opacity = '1';
        el('compass').style.opacity = '0';
    }

    const txt = el('stepText');
    txt.innerHTML = stepTexts[n];
    if (n >= 3) {
        txt.style.background = '#c8e6c9'; txt.style.borderLeftColor = '#4caf50'; txt.style.color = '#2e7d32';
    } else {
        txt.style.background = '#e3f2fd'; txt.style.borderLeftColor = '#2196f3'; txt.style.color = '#1565c0';
    }

    el('nextBtn').textContent = (n >= 3) ? '✓ Terminé' : '▶ Étape suivante';
    el('nextBtn').disabled = false;
    el('prevBtn').disabled = (n === 0);
    currentStep = n;
}

let isAnimating = false;

function goPrev() {
    if (isAnimating) return;
    if (currentStep <= 0) return;
    renderStep(currentStep - 1);
}

// ── ÉTAPES ───────────────────────────────────────────────
async function nextStep() {
    if (isAnimating) return;
    const txt = el('stepText');
    const btn = el('nextBtn');
    if (currentStep >= 3) return;
    isAnimating = true;
    btn.disabled = true;
    el('prevBtn').disabled = true;

    // 1 : symétriques de A et B, puis la droite (A'B')
    if (currentStep === 0) {
        txt.innerHTML = stepTexts[1];
        setCompass(O, O);
        curPen = {x: O.x, y: O.y};
        await sleep(200);
        await reflectPoint(A, Ap, 'pA', 'lA', 'rayA');
        await reflectPoint(B, Bp, 'pB', 'lB', 'rayB');
        await sleep(200);
        await growLine(el('lineePrime'), 997, 843, 330, 674, 1000);
        await sleep(250);
        currentStep = 1;
    }

    // 2 : symétriques de C, D, E, puis le triangle D'C'E'
    else if (currentStep === 1) {
        txt.innerHTML = stepTexts[2];
        await reflectPoint(C, Cp, 'pC', 'lC', 'rayC');
        await reflectPoint(D, Dp, 'pD', 'lD', 'rayD');
        await reflectPoint(E, Ep, 'pE', 'lE', 'rayE');
        await sleep(200);
        await growPath(el('trianglePrime'), [Cp, Dp, Ep, Cp], 1200);
        await sleep(250);
        currentStep = 2;
    }

    // 3 : symétrique de F, puis le cercle -> figure symétrique complète
    else if (currentStep === 2) {
        txt.innerHTML = stepTexts[3];
        txt.style.background      = '#c8e6c9';
        txt.style.borderLeftColor = '#4caf50';
        txt.style.color           = '#2e7d32';
        await reflectPoint(F, Fp, 'pF', 'lF', 'rayF');
        await sleep(300);
        await drawCircleWithCompass(F, Fp, R);
        currentStep = 3;
        btn.textContent = '✓ Terminé';
    }

    isAnimating = false;
    btn.disabled = false;
    el('prevBtn').disabled = (currentStep === 0);
}

// ── RESET ─────────────────────────────────────────────────
function resetAnimation() {
    renderStep(0);
}

// ── Communication avec la page parente (bouton flottant) ──
(function() {
    function postState() {
        if (window.parent === window) return;
        window.parent.postMessage({
            type: 'symAnimState',
            nextText: el('nextBtn').textContent,
            nextDisabled: el('nextBtn').disabled,
            prevDisabled: el('prevBtn').disabled
        }, '*');
    }
    const mo = new MutationObserver(postState);
    mo.observe(el('nextBtn'), {attributes:true, childList:true, characterData:true, subtree:true});
    mo.observe(el('prevBtn'), {attributes:true});
    window.addEventListener('load', postState);
    window.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'symAnimCmd') return;
        if (e.data.cmd === 'next') nextStep();
        else if (e.data.cmd === 'prev') goPrev();
        else if (e.data.cmd === 'reset') resetAnimation();
        else if (e.data.cmd === 'sync') postState();
    });
})();
</script>
