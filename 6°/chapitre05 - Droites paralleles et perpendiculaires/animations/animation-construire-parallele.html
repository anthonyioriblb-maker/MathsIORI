<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation : Construire une parallèle à l'équerre et à la règle</title>
    <style>
        body { margin:0; padding:0; background:#fafafa;
               font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        .container { max-width: 100%; margin:0 auto; padding: 20px 30px; }
        .step-text {
            background:#e3f2fd; border-left:5px solid #2196f3;
            padding:15px 20px; margin:15px 0; color:#1565c0;
            font-size:17px; min-height:60px; font-weight:500;
            display:block; line-height:1.6;
        }
        svg { display:block; margin:0 auto; background:#fafafa;
              border:2px solid #ddd; border-radius:8px; }
        .controls { text-align:center; margin:20px 0; }
        button {
            background:#3498db; color:white; border:none;
            padding:14px 28px; margin:8px; border-radius:6px;
            cursor:pointer; font-size:17px; font-weight:bold;
            box-shadow:0 2px 5px rgba(0,0,0,0.2); transition:all 0.3s;
        }
        button:hover { background:#2980b9; transform:translateY(-2px); }
        button:disabled { background:#bdc3c7; cursor:not-allowed; transform:none; }
        button.reset { background:#e74c3c; }
        button.reset:hover { background:#c0392b; }
    </style>
</head>
<body>
<div class="container">
    <div class="step-text" id="stepText">
        Cliquez sur « Étape suivante » pour voir la construction étape par étape.
    </div>

    <svg id="anim" width="700" height="450" viewBox="0 0 700 450">

        <!-- ══ TOUJOURS VISIBLES ══ -->
        <!-- Droite (d) oblique (≈20°) -->
        <line x1="96.3" y1="392.3" x2="603.7" y2="207.7" stroke="#333" stroke-width="2.5"/>
        <text x="608" y="200" font-size="20" fill="#333" font-weight="bold">(d)</text>

        <!-- Point A -->
        <line x1="379.8" y1="100.1" x2="391.8" y2="112.1" stroke="#2980b9" stroke-width="3"/>
        <line x1="391.8" y1="100.1" x2="379.8" y2="112.1" stroke="#2980b9" stroke-width="3"/>
        <text x="397" y="104" font-size="22" fill="#2980b9" font-weight="bold">A</text>

        <!-- ══ RÈGLE (fixe, à côté de l'équerre, jamais superposée) ══ -->
        <!-- Ancrée en EQ_START=(350,300), même rotation que l'équerre. Rectangle local x∈[-20,0] : toujours du côté opposé au triangle (x∈[0,150]). -->
        <g id="ruler" opacity="0" transform="translate(350,300) rotate(-20)">
            <rect x="-20" y="-200" width="20" height="230" fill="#f0e0b0" stroke="#8a6d3b" stroke-width="2" rx="2"/>
            <line x1="-20" y1="-170" x2="0" y2="-170" stroke="#8a6d3b" stroke-width="1.5"/>
            <line x1="-20" y1="-120" x2="0" y2="-120" stroke="#8a6d3b" stroke-width="1.5"/>
            <line x1="-20" y1="-70"  x2="0" y2="-70"  stroke="#8a6d3b" stroke-width="1.5"/>
            <line x1="-20" y1="-20"  x2="0" y2="-20"  stroke="#8a6d3b" stroke-width="1.5"/>
        </g>

        <!-- ══ ÉQUERRE ══ -->
        <!-- Triangle local : (0,0) (150,0) (0,-220). Un côté sur (d), l'autre le long de la règle (jamais superposé : règle en x∈[-20,0], triangle en x∈[0,150]). -->
        <g id="setSquare" opacity="0" transform="translate(350,300) rotate(-20)">
            <polygon points="0,0 150,0 0,-220"
                     fill="rgba(100,180,255,0.25)" stroke="#2980b9"
                     stroke-width="2.5" stroke-linejoin="round"/>
            <!-- Angle droit en (0,0) local -->
            <polyline points="14,0 14,-14 0,-14"
                      fill="none" stroke="#2980b9" stroke-width="1.8"/>
        </g>

        <!-- ══ PARALLÈLE (tracée à l'étape 4) ══ -->
        <line id="paraLine" x1="263.7" y1="150.5" x2="461" y2="78.7"
              stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3" opacity="0"/>

    </svg>

    <div class="controls">
        <button id="nextBtn" onclick="nextStep()">▶ Étape suivante</button>
        <button class="reset" onclick="resetAnimation()">🔄 Recommencer</button>
    </div>
</div>

<script>
const el = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const EQ_START = {x:350, y:300};        // sur (d)
const EQ_END   = {x:291.9, y:140.3};    // glisse le long de la règle (perpendiculairement à (d)), jusqu'à ce que le côté passe par A
const EQ_ANGLE = -20; // degrés, angle de (d)

let currentStep = 0;

const stepTexts = [
    'Cliquez sur « Étape suivante » pour voir la construction étape par étape.',
    '<strong style="color:#2980b9;font-size:20px;">1.</strong> Je place un côté de l\'angle droit de l\'équerre le long de (d).',
    '<strong style="color:#8a6d3b;font-size:20px;">2.</strong> Je place une règle le long de l\'autre côté de l\'équerre.',
    '<strong style="color:#2980b9;font-size:20px;">3.</strong> Je maintiens la règle fixe et je fais glisser l\'équerre le long de la règle, jusqu\'à ce que le premier côté passe par le point A.',
    '<strong style="color:#e74c3c;font-size:20px;">4.</strong> Je trace la parallèle à (d) en suivant ce côté de l\'équerre.',
    '<strong style="color:#555;font-size:20px;">5.</strong> Je range l\'équerre et la règle.',
    '<strong style="color:#27ae60;font-size:20px;">6.</strong> La droite tracée est parallèle à (d) et passe par A. ✓'
];

async function slideSquare(from, to, duration) {
    const N = 50;
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const x = from.x + (to.x - from.x) * t;
        const y = from.y + (to.y - from.y) * t;
        el('setSquare').setAttribute('transform', `translate(${x},${y}) rotate(${EQ_ANGLE})`);
        await sleep(duration / N);
    }
}

async function nextStep() {
    const txt = el('stepText');
    const btn = el('nextBtn');
    if (currentStep >= 6) return;
    btn.disabled = true;

    // 1 : équerre apparaît sur (d)
    if (currentStep === 0) {
        txt.innerHTML = stepTexts[1];
        el('setSquare').setAttribute('transform', `translate(${EQ_START.x},${EQ_START.y}) rotate(${EQ_ANGLE})`);
        el('setSquare').style.opacity = '1';
        await sleep(1000);
        currentStep = 1;
    }

    // 2 : règle placée le long de l'autre côté
    else if (currentStep === 1) {
        txt.innerHTML = stepTexts[2];
        el('ruler').style.opacity = '1';
        await sleep(1000);
        currentStep = 2;
    }

    // 3 : équerre glisse le long de la règle jusqu'à A
    else if (currentStep === 2) {
        txt.innerHTML = stepTexts[3];
        await sleep(400);
        await slideSquare(EQ_START, EQ_END, 2200);
        await sleep(800);
        currentStep = 3;
    }

    // 4 : parallèle tracée
    else if (currentStep === 3) {
        txt.innerHTML = stepTexts[4];
        el('paraLine').style.opacity = '1';
        await sleep(1200);
        currentStep = 4;
    }

    // 5 : ranger équerre et règle
    else if (currentStep === 4) {
        txt.innerHTML = stepTexts[5];
        el('setSquare').style.opacity = '0';
        el('ruler').style.opacity = '0';
        await sleep(700);
        currentStep = 5;
    }

    // 6 : conclusion
    else if (currentStep === 5) {
        txt.innerHTML = stepTexts[6];
        txt.style.background      = '#c8e6c9';
        txt.style.borderLeftColor = '#4caf50';
        txt.style.color           = '#2e7d32';
        currentStep = 6;
        btn.textContent = '✓ Terminé';
    }

    btn.disabled = false;
}

function resetAnimation() {
    ['setSquare','ruler','paraLine'].forEach(id => {
        el(id).style.opacity = '0';
    });
    el('setSquare').setAttribute('transform', `translate(${EQ_START.x},${EQ_START.y}) rotate(${EQ_ANGLE})`);

    const txt = el('stepText');
    txt.innerHTML             = stepTexts[0];
    txt.style.background      = '#e3f2fd';
    txt.style.borderLeftColor = '#2196f3';
    txt.style.color           = '#1565c0';

    const btn = el('nextBtn');
    btn.textContent = '▶ Étape suivante';
    btn.disabled    = false;
    currentStep     = 0;
}
</script>
</body>
</html>
