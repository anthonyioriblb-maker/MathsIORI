<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Poser une soustraction</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f8;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 30px;
}

.wrap {
  background: white; border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  padding: 20px; width: 100%;
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 14px;
}

.step-text {
  background: #e3f2fd; border-left: 5px solid #2196f3;
  padding: 14px 20px; border-radius: 0 8px 8px 0;
  font-size: 1rem; color: #1565c0; width: 100%;
  min-height: 52px; display: block; line-height: 1.6;
  font-weight: 500; margin-bottom: 14px;
}

.operation-posee {
    font-family: 'Courier New', monospace;
    font-size: 2em;
    line-height: 1.1;
    text-align: center;
    display: inline-block;
    position: relative;
    margin: 10px auto;
}

.ligne-operation {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    min-height: 28px;
    position: relative;
}

.chiffre {
    width: 35px;
    text-align: center;
    display: inline-block;
    opacity: 0;
    transition: all 0.4s ease;
}

.chiffre.visible { opacity: 1; }

.chiffre.resultat {
    color: #2ecc71;
    font-weight: bold;
}

.symbole {
    width: 40px;
    text-align: center;
    display: inline-block;
    opacity: 0;
}

.symbole.visible { opacity: 1; }

.ligne-separation {
    height: 3px;
    background-color: black;
    margin: 1px 0;
    opacity: 0;
    transition: opacity 0.3s ease;
    width: 240px;
    margin-left: auto;
}

.ligne-separation.visible { opacity: 1; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  padding: 11px 22px; border: none; border-radius: 8px;
  font-size: 0.95rem; font-weight: bold; cursor: pointer;
  transition: all 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
button:hover { transform: translateY(-2px); }
button:disabled { background: #bdbdbd !important; color: #fff; cursor: not-allowed; transform: none; }
#btnReset { background: #f44336; color: white; }
#btnNext  { background: #4caf50; color: white; }
</style>
</head>
<body>

<div class="wrap">
  <div class="step-text" id="stepText">
    Cliquez sur « Étape suivante » pour démarrer l'animation
  </div>

  <div class="operation-posee" id="soustractionOp">
    <!-- Ligne 1 -->
    <div class="ligne-operation" style="position: relative;">
        <span class="symbole">&nbsp;</span>
        <span class="chiffre" id="s1_1">8</span>
        <span class="chiffre" id="s1_v">,</span>
        <span class="chiffre" id="s1_2" style="position: relative;">
            <span id="petit1_1" style="position: absolute; left: -4px; top: 10px; font-size: 0.5em; color: #e74c3c; opacity: 0;">1</span>
            5
        </span>
        <span class="chiffre" id="s1_3" style="position: relative;">
            <span id="petit1_2" style="position: absolute; left: -4px; top: 10px; font-size: 0.5em; color: #e74c3c; opacity: 0;">1</span>
            0
        </span>
    </div>

    <!-- Ligne 2 -->
    <div class="ligne-operation">
        <span class="symbole visible">−</span>
        <span class="chiffre" id="s2_1" style="position: relative;">
            <span id="plus1_1" style="position: absolute; left: -10px; top: 22px; font-size: 0.5em; color: #e74c3c; opacity: 0;">+1</span>
            2
        </span>
        <span class="chiffre" id="s2_v">,</span>
        <span class="chiffre" id="s2_2" style="position: relative;">
            <span id="plus1_2" style="position: absolute; left: -10px; top: 22px; font-size: 0.5em; color: #e74c3c; opacity: 0;">+1</span>
            8
        </span>
        <span class="chiffre" id="s2_3">7</span>
    </div>

    <!-- Ligne de séparation -->
    <div class="ligne-separation" id="ligne_sous"></div>

    <!-- Résultat -->
    <div class="ligne-operation">
        <span class="symbole">&nbsp;</span>
        <span class="chiffre resultat" id="sres_1">5</span>
        <span class="chiffre resultat" id="sres_v">,</span>
        <span class="chiffre resultat" id="sres_2">6</span>
        <span class="chiffre resultat" id="sres_3">3</span>
    </div>
  </div>

  <div class="controls">
    <button id="btnNext" onclick="nextStep()">▶ Étape suivante</button>
    <button id="btnReset" onclick="resetAnimation()">🔄 Recommencer</button>
  </div>
</div>

<script>
let step = 0;

function nextStep() {
    const stepText = document.getElementById('stepText');

    switch (step) {
        case 0:
            ['s1_1', 's1_v', 's1_2', 's1_3', 's2_1', 's2_v', 's2_2', 's2_3'].forEach(id => {
                document.getElementById(id).classList.add('visible');
            });
            stepText.innerHTML = 'Les nombres sont alignés. On ajoute un 0 pour avoir le même nombre de décimales';
            break;
        case 1:
            document.getElementById('ligne_sous').classList.add('visible');
            stepText.innerHTML = 'Colonne de droite : 0 − 7 impossible ! J\'écris un petit 1 à côté du 0 (pour faire 10) et je marque +1 sur le 8';
            document.getElementById('petit1_2').style.opacity = '1';
            document.getElementById('plus1_2').style.opacity = '1';
            break;
        case 2:
            stepText.innerHTML = '10 − 7 = 3. Je pose 3';
            document.getElementById('sres_3').classList.add('visible');
            break;
        case 3:
            stepText.innerHTML = '5 − (8+1) impossible ! J\'écris un petit 1 à côté du 5 (pour faire 15) et je marque +1 sur le 2';
            document.getElementById('petit1_1').style.opacity = '1';
            document.getElementById('plus1_1').style.opacity = '1';
            break;
        case 4:
            stepText.innerHTML = '15 − 9 = 6. Je pose 6 et la virgule';
            document.getElementById('sres_2').classList.add('visible');
            document.getElementById('sres_v').classList.add('visible');
            break;
        case 5:
            stepText.innerHTML = '8 − (2+1) = 8 − 3 = 5. Je pose 5';
            document.getElementById('sres_1').classList.add('visible');
            break;
        case 6:
            stepText.innerHTML = '<strong style="color: #2ecc71;">✓ Résultat : 8,5 − 2,87 = 5,63</strong>';
            document.getElementById('btnNext').disabled = true;
            break;
    }
    step++;
}

function resetAnimation() {
    step = 0;
    document.getElementById('btnNext').disabled = false;
    document.getElementById('stepText').innerHTML = 'Cliquez sur « Étape suivante » pour démarrer l\'animation';

    ['s1_1', 's1_v', 's1_2', 's1_3', 's2_1', 's2_v', 's2_2', 's2_3',
     'ligne_sous', 'sres_1', 'sres_v', 'sres_2', 'sres_3'].forEach(id => {
        document.getElementById(id).classList.remove('visible');
    });
    ['petit1_1', 'petit1_2', 'plus1_1', 'plus1_2'].forEach(id => {
        document.getElementById(id).style.opacity = '0';
    });
}
</script>
</body>
</html>
