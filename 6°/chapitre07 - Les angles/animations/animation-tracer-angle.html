<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Tracer un angle de mesure donnée</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #e3f2fd; border-left: 5px solid #2196f3;
        padding: 12px 18px; margin-bottom: 8px; color: #1565c0;
        font-size: 16px; font-weight: 500; min-height: 54px;
        display: block; line-height: 1.6;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
    }
    .angle {
        position: relative;
        display: inline-block;
    }
    .angle::before {
        content: '^';
        position: absolute;
        top: -0.5em;
        left: 50%;
        transform: translateX(-50%) scaleX(2.5) scaleY(1.2);
        font-size: 1.5em;
        font-weight: 300;
    }

    /* ── Animation tracer un angle : rapporteur glisse et arrive décalé, puis pivote une seule fois pour s'aligner sur [AB) ── */
    @keyframes rapTracArrive {
        0%   { transform: translate(320px,-90px) rotate(0deg);  opacity: 0; }
        30%  { opacity: 1; }
        55%  { transform: translate(0,0) rotate(-14deg); opacity: 1; }
        100% { transform: translate(0,0) rotate(0deg);   opacity: 1; }
    }
    @keyframes rapTracDisparait {
        0%   { opacity: 1; }
        100% { opacity: 0; }
    }
    #rapTrac {
        transform-origin: 100px 260px;   /* pivot = sommet A */
    }
    #rapTrac.rap-hidden   { opacity: 0; }
    #rapTrac.trac-arrive  { animation: rapTracArrive 2.2s cubic-bezier(0.22,1,0.36,1) forwards; }
    #rapTrac.trac-cache   { animation: rapTracDisparait 0.4s ease-in forwards; }

    /* ── Balayage vers 72° ── */
    @keyframes sweepScan {
        0%   { transform: rotate(0deg);   opacity: 1; }
        75%  { transform: rotate(-72deg); opacity: 1; }
        90%  { transform: rotate(-72deg); opacity: 1; }
        100% { transform: rotate(-72deg); opacity: 0; }
    }
    @keyframes fadeInMark {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }
    #sweepLine72 { transform-origin: 100px 260px; }
    #sweepLine72.sweep-active { animation: sweepScan 1.8s cubic-bezier(0.22,1,0.36,1) 2.2s forwards; }
    #mark72 { opacity: 0; }
    #mark72.mark-show { animation: fadeInMark 0.4s ease-out forwards; }

    @keyframes tracPencilDown {
        0%   { transform: translateY(-28px); opacity: 0; }
        35%  { opacity: 1; }
        100% { transform: translateY(0px); opacity: 1; }
    }
    @keyframes tracPencilUp {
        0%   { transform: translateY(0px);   opacity: 1; }
        100% { transform: translateY(-32px); opacity: 0; }
    }
    #pencilTrac { transform-origin: 131px 165px; }
    #pencilTrac.ptrac-draw   { animation: tracPencilDown 0.7s ease-out forwards; }
    #pencilTrac.ptrac-hide   { animation: tracPencilUp 0.5s ease-in forwards; }

    @keyframes tracDotPop {
        0%   { opacity: 0; transform: scale(0); }
        60%  { opacity: 1; transform: scale(1.4); }
        100% { opacity: 1; transform: scale(1); }
    }
    #pencilDot72 { transform-origin: 131px 165px; }
    #pencilDot72.dot-pop { animation: tracDotPop 0.4s ease-out forwards; }
</style>
</head>
<body>

<div class="step-box"><span id="stepTrac">Cliquez sur « Étape suivante » pour voir la construction.</span></div>
<div class="svg-wrap">
    <svg id="svgTrac" width="580" height="340" viewBox="0 0 580 340" style="max-width:100%; height:auto; background:#fafafa; display:block; margin:0 auto;">

        <!-- A=(100,260) B à droite sur horizontale  C=72° : (100+200*cos72, 260-200*sin72) = (162, 70) -->

        <!-- A marker -->
        <line x1="94" y1="254" x2="106" y2="266" stroke="black" stroke-width="2" opacity="0" id="tA1"/>
        <line x1="106" y1="254" x2="94" y2="266" stroke="black" stroke-width="2" opacity="0" id="tA2"/>
        <text x="78" y="262" font-size="20" font-weight="bold" opacity="0" id="tAl">A</text>

        <!-- AB ray (étape 1) — demi-droite étendue avec flèche -->
        <g id="rayAB" opacity="0">
            <!-- Ligne étendue au-delà de B jusqu'au bord du SVG -->
            <line x1="100" y1="260" x2="565" y2="260" stroke="black" stroke-width="2.5"/>
            <!-- Croix sur le point B (intermédiaire sur la demi-droite) -->
            <line x1="444" y1="254" x2="456" y2="266" stroke="black" stroke-width="1.8"/>
            <line x1="456" y1="254" x2="444" y2="266" stroke="black" stroke-width="1.8"/>
            <text x="456" y="252" font-size="18" font-weight="bold">B</text>
            <text x="280" y="295" text-anchor="middle" font-size="14" fill="#1565c0">On trace la demi-droite [AB)</text>
        </g>

        <!-- Rapporteur (étape 2) — cx=100 cy=260 r=100 -->
        <g id="rapTrac" class="rap-hidden">
            <!-- Corps cyan -->
            <path d="M 0 260 A 100 100 0 0 1 200 260 Z" fill="rgba(120,228,235,0.82)" stroke="#0a8090" stroke-width="2"/>
            <line x1="0" y1="260" x2="200" y2="260" stroke="#0a8090" stroke-width="1.5"/>
            <!-- Poignée -->
            <rect x="90" y="259" width="20" height="10" rx="4" fill="rgba(80,200,215,0.9)" stroke="#0a8090" stroke-width="1.2"/>
            <!-- Croix de centrage -->
            <circle cx="100" cy="260" r="7" fill="white" stroke="#222" stroke-width="1.4"/>
            <circle cx="100" cy="260" r="2" fill="#222"/>
            <line x1="93" y1="260" x2="107" y2="260" stroke="#222" stroke-width="1"/>
            <line x1="100" y1="253" x2="100" y2="267" stroke="#222" stroke-width="1"/>
            <!-- Ticks -->
            <g id="ticksTrac"></g>
            <g id="labelsTrac"></g>
            <g id="labels2Trac"></g>
            <!-- Case 90° -->
            <rect x="85" y="156" width="30" height="16" rx="3" fill="black"/>
            <text x="100" y="168" text-anchor="middle" font-size="10" fill="white" font-weight="bold">90°</text>
            <!-- Extrémités -->
            <text x="201" y="272" font-size="9" fill="#1565c0" font-weight="bold">0</text>
            <text x="200" y="258" font-size="7" fill="#c0392b">180</text>
            <text x="-16" y="272" font-size="9" fill="#1565c0" font-weight="bold">180</text>
            <text x="-8"  y="258" font-size="7" fill="#c0392b">0</text>
            <!-- Ligne de balayage -->
            <line id="sweepLine72" x1="100" y1="260" x2="193" y2="260" stroke="#e74c3c" stroke-width="2.2"/>
            <!-- Graduation 72° -->
            <g id="mark72">
                <line x1="100" y1="260" x2="131" y2="165" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="5,3"/>
                <text x="136" y="162" font-size="13" fill="#e74c3c" font-weight="bold">72°</text>
            </g>
            <text x="290" y="310" text-anchor="middle" font-size="13" fill="#1565c0">Le rapporteur est centré en A, le 0° est sur [AB)</text>
            <text x="290" y="327" text-anchor="middle" font-size="13" fill="#1565c0">On repère 72° et on fait un trait</text>
        </g>

        <!-- Zoom pédagogique : agrandit le VRAI rapporteur (pas une copie) pour confirmer que le trait tombe bien sur 72° -->
        <g id="zoomInsetTrac" opacity="0">
            <defs>
                <clipPath id="zoomClipTrac"><rect x="375" y="15" width="190" height="120" rx="10"/></clipPath>
            </defs>
            <rect x="375" y="15" width="190" height="120" rx="10" fill="white" stroke="#888" stroke-width="1.5"/>
            <text x="470" y="28" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Zoom : le trait tombe bien sur 72°</text>
            <g clip-path="url(#zoomClipTrac)">
                <g transform="translate(470,75) scale(2) translate(-125,-172.5)">
                    <use href="#rapTrac"/>
                </g>
            </g>
        </g>

        <!-- Crayon : marque le point à 72° sur le rapporteur.
             La pointe du polygone est en local (0,11) (pas (0,0)) : on doit donc translater
             de manière à ce que ce point, une fois pivoté de 18°, tombe exactement sur (131,165). -->
        <g id="pencilTrac" opacity="0">
            <g transform="translate(134.4,154.5) rotate(18)">
                <polygon points="-3.5,0 3.5,0 0,11" fill="#d4a76a"/>
                <line x1="0" y1="7" x2="0" y2="11" stroke="#222" stroke-width="1.5"/>
                <rect x="-3.5" y="-28" width="7" height="28" fill="#f7dc6f" stroke="#d4ac0d" stroke-width="0.8"/>
                <rect x="-3.5" y="-35" width="7" height="8" fill="#e8a0a0" stroke="#d4ac0d" stroke-width="0.8"/>
            </g>
        </g>

        <!-- Marque crayon (croix) à 72°, sur le bord du rapporteur — indépendante du rapporteur, reste visible quand celui-ci disparaît -->
        <g id="pencilDot72" opacity="0">
            <line x1="125" y1="165" x2="137" y2="165" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="131" y1="159" x2="131" y2="171" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Règle : bord supérieur (y=0) = [AC), graduations vers le bas -->
        <!-- A=(100,260)→C=(162,70), angle≈-71.9°, la demi-droite longe le bord -->
        <g id="rulerTrac" opacity="0" transform="translate(100,260) rotate(-71.9)">
            <rect x="-12" y="0" width="228" height="18" fill="rgba(210,235,255,0.90)" stroke="#4a80a8" stroke-width="1.5" rx="2"/>
            <!-- bord supérieur = ligne de tracé -->
            <line x1="-12" y1="0" x2="216" y2="0" stroke="#4a80a8" stroke-width="1.5"/>
            <!-- graduations (depuis le bord vers l'intérieur) -->
            <line x1="0"   y1="0" x2="0"   y2="18" stroke="#4a80a8" stroke-width="1.5"/>
            <line x1="20"  y1="0" x2="20"  y2="7"  stroke="#4a80a8" stroke-width="0.8"/>
            <line x1="40"  y1="0" x2="40"  y2="11" stroke="#4a80a8" stroke-width="1.2"/>
            <line x1="60"  y1="0" x2="60"  y2="7"  stroke="#4a80a8" stroke-width="0.8"/>
            <line x1="80"  y1="0" x2="80"  y2="11" stroke="#4a80a8" stroke-width="1.2"/>
            <line x1="100" y1="0" x2="100" y2="18" stroke="#4a80a8" stroke-width="1.5"/>
            <line x1="120" y1="0" x2="120" y2="7"  stroke="#4a80a8" stroke-width="0.8"/>
            <line x1="140" y1="0" x2="140" y2="11" stroke="#4a80a8" stroke-width="1.2"/>
            <line x1="160" y1="0" x2="160" y2="7"  stroke="#4a80a8" stroke-width="0.8"/>
            <line x1="180" y1="0" x2="180" y2="11" stroke="#4a80a8" stroke-width="1.2"/>
            <line x1="200" y1="0" x2="200" y2="18" stroke="#4a80a8" stroke-width="1.5"/>
        </g>

        <!-- AC ray final — demi-droite étendue au-delà de C avec flèche, tracée directement une fois la règle posée -->
        <g id="rayAC" opacity="0">
            <line x1="100" y1="260" x2="183" y2="5" stroke="black" stroke-width="2.5"/>
            <!-- Croix sur le point C (intermédiaire sur la demi-droite) -->
            <line x1="156" y1="64" x2="168" y2="76" stroke="black" stroke-width="1.8"/>
            <line x1="168" y1="64" x2="156" y2="76" stroke="black" stroke-width="1.8"/>
            <text x="170" y="62" font-size="18" font-weight="bold">C</text>
            <text x="280" y="312" text-anchor="middle" font-size="14" fill="#1565c0">On trace la demi-droite [AC) — C est placé sur cette demi-droite</text>
        </g>

        <!-- Notation de l'angle BAC = 72° : révélée seulement après avoir rangé la règle -->
        <g id="angleMark72" opacity="0">
            <path d="M 160 260 A 60 60 0 0 0 119 203" stroke="#e74c3c" stroke-width="2" fill="rgba(231,76,60,0.12)"/>
            <text x="168" y="235" font-size="16" fill="#e74c3c" font-weight="bold">72°</text>
        </g>

    </svg>
</div>
<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>◀ Étape précédente</button>
    <button class="btn-anim" onclick="nextStep()">Étape suivante ▶</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">⏵ Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer ↺</button>
</div>

<script>

const texts = [
    "Cliquez sur « Étape suivante » pour voir comment tracer l'angle <span class='angle'>BAC</span> = 72°.",
    "Étape 1 : On trace la demi-droite [AB) et on place le point <strong>A</strong> (sommet).",
    "Étape 2 : On place le centre du rapporteur en <strong>A</strong>, on aligne le <strong>0°</strong> sur [AB) et on repère <strong>72°</strong> par un trait.",
    "Étape 3 : On enlève le rapporteur, on place la règle sur le point marqué et on trace la demi-droite [AC), en plaçant le point <strong>C</strong> dessus.",
    "Étape 4 : On range la règle. L'angle <span class='angle'>BAC</span> = <strong>72°</strong> est construit !"
];
let step = 0;

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

let autoTimer = null;

function updateButtons() {
    const btnPrec = document.getElementById('btnPrec');
    if (btnPrec) btnPrec.disabled = (step <= 0);
}

function nextStep() {
    stopAuto();
    advanceStep();
}

function advanceStep() {
    if (step >= 4) return;
    step++;
    document.getElementById('stepTrac').innerHTML = texts[step];
    const rapT = document.getElementById('rapTrac');
    if (step >= 1) { setOpacity('tA1', 1); setOpacity('tA2', 1); setOpacity('tAl', 1); setOpacity('rayAB', 1); }
    if (step === 2) {
        // Rapporteur glisse depuis la droite puis s'aligne sur [AB)
        rapT.classList.remove('rap-hidden', 'trac-cache');
        void rapT.offsetWidth;
        rapT.classList.add('trac-arrive');
        // Balayage vers 72° (démarre après 2.2s)
        const sw = document.getElementById('sweepLine72');
        const mk = document.getElementById('mark72');
        sw.classList.remove('sweep-active');
        mk.classList.remove('mark-show');
        void sw.offsetWidth;
        sw.classList.add('sweep-active');
        // mark72 reste caché — le crayon l'affiche
        // Crayon apparaît après la fin du balayage (~4.1s)
        setTimeout(() => {
            const pt = document.getElementById('pencilTrac');
            pt.style.opacity = '1';
            pt.classList.remove('ptrac-draw', 'ptrac-hide');
            void pt.offsetWidth;
            pt.classList.add('ptrac-draw');
            // Quand le crayon touche (~0.7s), mark72 apparaît + le point reste marqué sur la feuille
            setTimeout(() => {
                mk.classList.remove('mark-show');
                void mk.offsetWidth;
                mk.classList.add('mark-show');
                const dot72 = document.getElementById('pencilDot72');
                dot72.style.opacity = '1';
                dot72.classList.add('dot-pop');
                // Zoom pédagogique : confirme que le trait tombe bien sur 72°
                setTimeout(() => setOpacity('zoomInsetTrac', 1), 300);
            }, 650);
            // Crayon remonte après la marque
            setTimeout(() => {
                pt.classList.remove('ptrac-draw');
                void pt.offsetWidth;
                pt.classList.add('ptrac-hide');
            }, 900);
        }, 4100);
    }
    if (step === 3) {
        // 1) Le rapporteur disparaît en premier
        rapT.classList.remove('trac-arrive');
        void rapT.offsetWidth;
        rapT.classList.add('trac-cache');
        const sw = document.getElementById('sweepLine72');
        const mk = document.getElementById('mark72');
        sw.classList.remove('sweep-active');
        mk.classList.remove('mark-show');
        setOpacity('zoomInsetTrac', 0);
        // 2) Une fois le rapporteur bien enlevé (0.4s), la règle se met en place
        setTimeout(() => {
            if (step !== 3) return;
            setOpacity('rulerTrac', 1);
            // 3) Puis, une fois la règle posée, on trace directement la demi-droite [AC)
            setTimeout(() => {
                if (step !== 3) return;
                setOpacity('rayAC', 1);
            }, 700);
        }, 450);
    }
    if (step >= 4) {
        // 1) La règle est rangée une fois le tracé terminé
        setOpacity('rulerTrac', 0);
        // 2) La notation de l'angle n'apparaît qu'une fois la règle rangée
        setTimeout(() => {
            if (step < 4) return;
            setOpacity('angleMark72', 1);
        }, 400);
    }
    updateButtons();
}

// Reconstruit instantanément l'état visuel pour l'étape n, sans les animations CSS ni les délais
// (utilisé par « précédent » et par le retour en arrière de l'automatique)
function renderStep(n) {
    stopAuto();
    step = n;
    document.getElementById('stepTrac').innerHTML = texts[n];

    setOpacity('tA1', n >= 1 ? 1 : 0);
    setOpacity('tA2', n >= 1 ? 1 : 0);
    setOpacity('tAl', n >= 1 ? 1 : 0);
    setOpacity('rayAB', n >= 1 ? 1 : 0);

    const rapT = document.getElementById('rapTrac');
    rapT.classList.remove('trac-arrive', 'trac-cache', 'rap-hidden');
    rapT.style.transform = '';
    const sw = document.getElementById('sweepLine72');
    const mk = document.getElementById('mark72');
    sw.classList.remove('sweep-active');
    // sweepLine72 n'a pas d'état "masqué" par défaut en CSS (seule l'animation le fait disparaître
    // à la fin) : il faut donc le cacher explicitement ici, sinon il réapparaît à plat sur [AB).
    sw.style.opacity = '0';
    mk.classList.remove('mark-show');
    const pt = document.getElementById('pencilTrac');
    pt.classList.remove('ptrac-draw', 'ptrac-hide');
    pt.style.opacity = '0';
    const dot72 = document.getElementById('pencilDot72');
    dot72.classList.remove('dot-pop');
    dot72.style.opacity = (n >= 2) ? '1' : '0';

    if (n === 2) {
        // Rapporteur visible, aligné sur [AB), mesure de 72° déjà faite
        mk.classList.add('mark-show');
        setOpacity('zoomInsetTrac', 1);
    } else {
        rapT.classList.add('rap-hidden');
        setOpacity('zoomInsetTrac', 0);
    }
    setOpacity('rulerTrac', n === 3 ? 1 : 0);
    setOpacity('rayAC', n >= 3 ? 1 : 0);
    setOpacity('angleMark72', n >= 4 ? 1 : 0);

    updateButtons();
}

function prevStep() {
    if (step > 0) renderStep(step - 1);
}

function resetAnimation() {
    stopAuto();
    renderStep(0);
}

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= 4) renderStep(0);
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= 4) { stopAuto(); return; }
        advanceStep();
    }, 5800);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}

buildProto(100, 260, 100, 72, 'ticksTrac', 'labelsTrac', 'labels2Trac');

function buildProto(cx, cy, r, highlightDeg, ticksId, labelsId, labels2Id) {
    const NS = 'http://www.w3.org/2000/svg';
    const gT  = document.getElementById(ticksId);
    const gL  = document.getElementById(labelsId);
    const gL2 = document.getElementById(labels2Id);
    if (!gT) return;

    for (let deg = 0; deg <= 180; deg++) {
        const rad = deg * Math.PI / 180;
        const xo = cx + r * Math.cos(rad);
        const yo = cy - r * Math.sin(rad);
        let len = 3;
        if (deg % 5  === 0) len = 5;
        if (deg % 10 === 0) len = 9;
        const xi = cx + (r - len) * Math.cos(rad);
        const yi = cy - (r - len) * Math.sin(rad);
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', xo.toFixed(1)); line.setAttribute('y1', yo.toFixed(1));
        line.setAttribute('x2', xi.toFixed(1)); line.setAttribute('y2', yi.toFixed(1));
        line.setAttribute('stroke', '#1a6070');
        line.setAttribute('stroke-width', deg % 10 === 0 ? '1.4' : deg % 5 === 0 ? '0.9' : '0.5');
        gT.appendChild(line);
    }

    for (let deg = 10; deg <= 170; deg += 10) {
        if (deg === 90) continue;
        const rad = deg * Math.PI / 180;
        const lx = cx + (r - 17) * Math.cos(rad);
        const ly = cy - (r - 17) * Math.sin(rad);
        const txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', lx.toFixed(1));
        txt.setAttribute('y', (ly + 3.5).toFixed(1));
        txt.setAttribute('font-size', r >= 110 ? '9' : '8');
        txt.setAttribute('fill', deg === highlightDeg ? '#e74c3c' : '#1a4a8a');
        txt.setAttribute('font-weight', deg === highlightDeg ? 'bold' : 'normal');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = deg;
        gL.appendChild(txt);
    }

    for (let deg = 10; deg <= 170; deg += 10) {
        if (deg === 90) continue;
        const rad = deg * Math.PI / 180;
        const lx = cx + (r - 27) * Math.cos(rad);
        const ly = cy - (r - 27) * Math.sin(rad);
        const txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', lx.toFixed(1));
        txt.setAttribute('y', (ly + 3).toFixed(1));
        txt.setAttribute('font-size', r >= 110 ? '8' : '7');
        txt.setAttribute('fill', (180 - deg) === highlightDeg ? '#e74c3c' : '#b03020');
        txt.setAttribute('font-weight', (180 - deg) === highlightDeg ? 'bold' : 'normal');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = 180 - deg;
        gL2.appendChild(txt);
    }
}
</script>
</body>
</html>
