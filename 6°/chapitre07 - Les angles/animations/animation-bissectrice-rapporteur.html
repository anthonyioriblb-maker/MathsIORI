<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Tracer la bissectrice au rapporteur</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #e3f2fd; border-left: 5px solid #2196f3;
        padding: 12px 18px; margin-bottom: 8px; color: #1565c0;
        font-size: 16px; font-weight: 500; min-height: 54px;
        display: block; line-height: 1.6;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
    }
    .angle {
        position: relative;
        display: inline-block;
    }
    .angle::before {
        content: '^';
        position: absolute;
        top: -0.5em;
        left: 50%;
        transform: translateX(-50%) scaleX(2.5) scaleY(1.2);
        font-size: 1.5em;
        font-weight: 300;
    }

    /* ── Bissectrice au rapporteur : arrivée décalée, puis un seul pivot doux vers l'alignement ── */
    @keyframes brRapArrive {
        0%   { transform: translate(280px,-70px) rotate(0deg);  opacity: 0; }
        25%  { opacity: 1; }
        55%  { transform: translate(0,0) rotate(-12deg); opacity: 1; }
        100% { transform: translate(0,0) rotate(0deg);   opacity: 1; }
    }
    @keyframes brRapDisparait {
        0%   { opacity: 1; }
        100% { opacity: 0; }
    }
    @keyframes brPencilDown {
        0%   { transform: translateY(-28px); opacity: 0; }
        35%  { opacity: 1; }
        100% { transform: translateY(0px); opacity: 1; }
    }
    @keyframes brPencilUp {
        0%   { transform: translateY(0px);   opacity: 1; }
        100% { transform: translateY(-32px); opacity: 0; }
    }
    @keyframes brDotPop {
        0%   { opacity: 0; transform: scale(0); }
        60%  { opacity: 1; transform: scale(1.4); }
        100% { opacity: 1; transform: scale(1); }
    }
    #brRapporteur { transform-origin: 130px 270px; }
    #brRapporteur.br-hidden  { opacity: 0; }
    #brRapporteur.br-arrive  { animation: brRapArrive 2.2s cubic-bezier(0.22,1,0.36,1) forwards; }
    #brRapporteur.br-cache   { animation: brRapDisparait 0.4s ease-in forwards; }
    #brPencil { transform-origin: 199px 212px; }
    #brPencil.pencil-draw    { animation: brPencilDown 0.7s ease-out forwards; }
    #brPencil.pencil-hide    { animation: brPencilUp 0.5s ease-in forwards; }
    #brDot40  { transform-origin: 199px 212px; }
    #brDot40.dot-pop         { animation: brDotPop 0.4s ease-out forwards; }
</style>
</head>
<body>

<div class="step-box"><span id="stepBisRap">Cliquez sur « Étape suivante » pour voir la construction.</span></div>
<div class="svg-wrap">
    <svg id="svgBisRap" width="500" height="320" viewBox="-15 -15 530 350" style="max-width:100%; height:auto; background:#fafafa; display:block; margin:0 auto;">

        <!-- O=(130,270) A=(420,270) B à 80°=(165,73) D à 40°=(283,141) -->

        <!-- [OA) prolongée au-delà de A -->
        <g id="brOA" opacity="0">
            <line x1="130" y1="270" x2="440" y2="270" stroke="black" stroke-width="2.5"/>
            <line x1="416" y1="266" x2="424" y2="274" stroke="black" stroke-width="1.8"/>
            <line x1="424" y1="266" x2="416" y2="274" stroke="black" stroke-width="1.8"/>
            <text x="428" y="282" font-size="18" font-weight="bold">A</text>
        </g>
        <!-- [OB) prolongée au-delà de B -->
        <g id="brOB" opacity="0">
            <line x1="130" y1="270" x2="169" y2="53" stroke="black" stroke-width="2.5"/>
            <line x1="161" y1="69" x2="169" y2="77" stroke="black" stroke-width="1.8"/>
            <line x1="169" y1="69" x2="161" y2="77" stroke="black" stroke-width="1.8"/>
            <text x="170" y="70" font-size="18" font-weight="bold">B</text>
        </g>
        <!-- O -->
        <g id="brO" opacity="0">
            <line x1="124" y1="264" x2="136" y2="276" stroke="black" stroke-width="2"/>
            <line x1="136" y1="264" x2="124" y2="276" stroke="black" stroke-width="2"/>
            <text x="108" y="274" font-size="18" font-weight="bold">O</text>
        </g>

        <!-- Arc AOB = 80° -->
        <!-- r=70 sur OA: (200,270) ; sur OB 80°: (130+70*cos80, 270-70*sin80)=(142,201) -->
        <g id="brArcAOB" opacity="0">
            <path d="M 130 270 L 200 270 A 70 70 0 0 0 142 201 Z" fill="rgba(52,152,219,0.12)" stroke="none"/>
            <path d="M 200 270 A 70 70 0 0 0 142 201" fill="none" stroke="#2980b9" stroke-width="2"/>
            <text x="214" y="236" font-size="15" fill="#2980b9" font-weight="bold">80°</text>
        </g>

        <!-- Rapporteur centré en O=(130,270) r=90 — classe CSS pour animation -->
        <g id="brRapporteur" class="br-hidden">
            <!-- Corps cyan -->
            <path d="M 40 270 A 90 90 0 0 1 220 270 Z" fill="rgba(120,228,235,0.82)" stroke="#0a8090" stroke-width="2"/>
            <line x1="40" y1="270" x2="220" y2="270" stroke="#0a8090" stroke-width="1.5"/>
            <!-- Poignée -->
            <rect x="120" y="269" width="20" height="10" rx="4" fill="rgba(80,200,215,0.9)" stroke="#0a8090" stroke-width="1.2"/>
            <!-- Croix de centrage -->
            <circle cx="130" cy="270" r="7" fill="white" stroke="#222" stroke-width="1.4"/>
            <circle cx="130" cy="270" r="2" fill="#222"/>
            <line x1="123" y1="270" x2="137" y2="270" stroke="#222" stroke-width="1"/>
            <line x1="130" y1="263" x2="130" y2="277" stroke="#222" stroke-width="1"/>
            <!-- Ticks -->
            <g id="ticksBR"></g>
            <g id="labelsBR"></g>
            <g id="labels2BR"></g>
            <!-- Case 90° -->
            <rect x="115" y="178" width="30" height="15" rx="3" fill="black"/>
            <text x="130" y="190" text-anchor="middle" font-size="10" fill="white" font-weight="bold">90°</text>
            <!-- Extrémités -->
            <text x="222" y="282" font-size="9" fill="#1565c0" font-weight="bold">0</text>
            <text x="220" y="268" font-size="7" fill="#c0392b">180</text>
            <text x="22"  y="282" font-size="9" fill="#1565c0" font-weight="bold">180</text>
            <text x="30"  y="268" font-size="7" fill="#c0392b">0</text>
            <!-- Marque 80° -->
            <!-- 80° r=82 : (130+82*cos80, 270-82*sin80)=(144,189) -->
            <line x1="130" y1="270" x2="144" y2="189" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" id="brLine80"/>
            <text x="146" y="183" font-size="11" fill="#e74c3c" font-weight="bold">80°</text>
            <!-- Marque 40° -->
            <line x1="130" y1="270" x2="199" y2="212" stroke="#27ae60" stroke-width="2.5" opacity="0" id="brLine40"/>
            <text x="202" y="208" font-size="12" fill="#27ae60" font-weight="bold" opacity="0" id="brLabel40">40°</text>
        </g>

        <!-- Crayon (apparaît après l'arrivée du rapporteur, tip à 40°=(199,212)) -->
        <!-- 40° sur r=90 : (130+90*cos40, 270-90*sin40) = (199,212)           -->
        <!-- rotate(-50) : corps part vers l'extérieur (dir radiale sortante)  -->
        <!-- translate(207,205) : compense pour que la pointe tombe en (199,212)-->
        <g id="brPencil" opacity="0">
            <g transform="translate(207,205) rotate(50)">
                <polygon points="-3.5,0 3.5,0 0,11" fill="#d4a76a"/>
                <line x1="0" y1="7" x2="0" y2="11" stroke="#222" stroke-width="1.5"/>
                <rect x="-3.5" y="-28" width="7" height="28" fill="#f7dc6f" stroke="#d4ac0d" stroke-width="0.8"/>
                <rect x="-3.5" y="-35" width="7" height="8" fill="#e8a0a0" stroke="#d4ac0d" stroke-width="0.8"/>
            </g>
        </g>
        <!-- Marque crayon à 40° (apparaît quand le crayon touche) -->
        <g id="brDot40" opacity="0">
            <line x1="193" y1="212" x2="205" y2="212" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="199" y1="206" x2="199" y2="218" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <!-- Résultat 80÷2=40 -->
        <text id="brResult" x="230" y="170" font-size="13" fill="#c0392b" font-weight="bold" opacity="0">80° ÷ 2 = <tspan font-size="15">40°</tspan></text>

        <!-- [OD) à 40° prolongée au-delà de D -->
        <g id="brOD" opacity="0">
            <line x1="130" y1="270" x2="298" y2="128" stroke="#e74c3c" stroke-width="2.5"/>
            <line x1="279" y1="137" x2="287" y2="145" stroke="#e74c3c" stroke-width="1.8"/>
            <line x1="287" y1="137" x2="279" y2="145" stroke="#e74c3c" stroke-width="1.8"/>
            <text x="288" y="148" font-size="18" font-weight="bold" fill="#e74c3c">D</text>
        </g>

        <!-- Deux arcs égaux (étape finale) -->
        <!-- Arc AOD vert r=55: OA=(185,270) OD40°=(130+55*cos40,270-55*sin40)=(172,235) -->
        <!-- Arc DOB bleu r=80: OD=(130+80*cos40,270-80*sin40)=(191,219) OB=(130+80*cos80,270-80*sin80)=(144,191) -->
        <g id="brArcsEqual" opacity="0">
            <path d="M 130 270 L 185 270 A 55 55 0 0 0 172 235 Z" fill="rgba(39,174,96,0.18)" stroke="none"/>
            <path d="M 185 270 A 55 55 0 0 0 172 235" fill="none" stroke="#27ae60" stroke-width="2.5"/>
            <text x="196" y="258" font-size="13" fill="#27ae60" font-weight="bold">40°</text>
            <path d="M 130 270 L 191 219 A 80 80 0 0 0 144 191 Z" fill="rgba(52,152,219,0.18)" stroke="none"/>
            <path d="M 191 219 A 80 80 0 0 0 144 191" fill="none" stroke="#2980b9" stroke-width="2.5"/>
            <text x="157" y="208" font-size="13" fill="#2980b9" font-weight="bold">40°</text>
        </g>

    </svg>
</div>
<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>◀ Étape précédente</button>
    <button class="btn-anim" onclick="nextStep()">Étape suivante ▶</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">⏵ Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer ↺</button>
</div>

<script>
const texts = [
    "Cliquez sur « Étape suivante » pour voir comment tracer la bissectrice de l'angle <span class='angle'>AOB</span> = 80° au rapporteur.",
    "Étape 1 : On trace l'angle <span class='angle'>AOB</span> = 80° avec ses deux côtés [OA) et [OB).",
    "Étape 2 : On place le rapporteur en O sur [OA) et on mesure 80°. On divise par 2 : 80° ÷ 2 = <strong>40°</strong>. On repère 40° sur le rapporteur.",
    "Étape 3 : On enlève le rapporteur et on trace la demi-droite [OD) à 40° de [OA). C'est la <strong>bissectrice</strong> de l'angle <span class='angle'>AOB</span> !",
    "Résultat : <span class='angle'>AOD</span> = <span class='angle'>DOB</span> = 40°. La bissectrice partage l'angle en deux angles <strong>adjacents de même mesure</strong>."
];
let step = 0;

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

let autoTimer = null;

function updateButtons() {
    const btnPrec = document.getElementById('btnPrec');
    if (btnPrec) btnPrec.disabled = (step <= 0);
}

function nextStep() {
    stopAuto();
    advanceStep();
}

function advanceStep() {
    if (step >= 4) return;
    step++;
    document.getElementById('stepBisRap').innerHTML = texts[step];

    if (step >= 1) {
        setOpacity('brOA',1); setOpacity('brOB',1); setOpacity('brO',1); setOpacity('brArcAOB',1);
    }
    if (step === 2) {
        // Rapporteur glisse et s'aligne
        const rap = document.getElementById('brRapporteur');
        rap.classList.remove('br-hidden', 'br-cache');
        void rap.offsetWidth;
        rap.classList.add('br-arrive');
        // Crayon descend après 2.3s
        setTimeout(() => {
            const p = document.getElementById('brPencil');
            p.style.opacity = '1';
            p.classList.add('pencil-draw');
        }, 2300);
        // Point + marque verte + résultat après 3s
        setTimeout(() => {
            const d = document.getElementById('brDot40');
            d.style.opacity = '1';
            d.classList.add('dot-pop');
            setOpacity('brLine40', 1);
            setOpacity('brLabel40', 1);
            // Crayon remonte après avoir fait la marque
            setTimeout(() => {
                const p = document.getElementById('brPencil');
                p.classList.remove('pencil-draw');
                void p.offsetWidth;
                p.classList.add('pencil-hide');
            }, 500);
        }, 3000);
        setTimeout(() => setOpacity('brResult', 1), 3600);
    }
    if (step === 3) {
        // Rapporteur disparaît — la croix reste (marque crayon sur le papier)
        const rap = document.getElementById('brRapporteur');
        rap.classList.remove('br-arrive');
        void rap.offsetWidth;
        rap.classList.add('br-cache');
        setOpacity('brPencil', 0);
        setOpacity('brResult', 0);
        setOpacity('brOD', 1);
        // brDot40 reste visible, brArcAOB reste visible
    }
    if (step >= 4) {
        // Le 80° disparaît et laisse place aux deux 40°
        setOpacity('brArcAOB', 0);
        setOpacity('brDot40', 0);
        setOpacity('brArcsEqual', 1);
    }
    updateButtons();
}

// Reconstruit instantanément l'état visuel pour l'étape n, sans les animations CSS ni les délais
// (utilisé par « précédent » et par le retour en arrière de l'automatique)
function renderStep(n) {
    stopAuto();
    step = n;
    document.getElementById('stepBisRap').innerHTML = texts[n];

    setOpacity('brOA', n >= 1 ? 1 : 0);
    setOpacity('brOB', n >= 1 ? 1 : 0);
    setOpacity('brO', n >= 1 ? 1 : 0);
    setOpacity('brArcAOB', (n >= 1 && n <= 3) ? 1 : 0);

    const rap = document.getElementById('brRapporteur');
    rap.classList.remove('br-arrive', 'br-cache', 'br-hidden');
    rap.style.transform = '';
    const p = document.getElementById('brPencil');
    p.classList.remove('pencil-draw', 'pencil-hide');
    p.style.opacity = '0';
    const d = document.getElementById('brDot40');
    d.classList.remove('dot-pop');
    d.style.opacity = (n >= 2 && n <= 3) ? '1' : '0';

    if (n !== 2) {
        rap.classList.add('br-hidden');
    }
    setOpacity('brLine40', n === 2 ? 1 : 0);
    setOpacity('brLabel40', n === 2 ? 1 : 0);
    setOpacity('brResult', n === 2 ? 1 : 0);
    setOpacity('brOD', n >= 3 ? 1 : 0);
    setOpacity('brArcsEqual', n >= 4 ? 1 : 0);

    updateButtons();
}

function prevStep() {
    if (step > 0) renderStep(step - 1);
}

function resetAnimation() {
    stopAuto();
    renderStep(0);
}

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= 4) renderStep(0);
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= 4) { stopAuto(); return; }
        advanceStep();
    }, 4400);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}

function buildProto(cx, cy, r, highlightDeg, ticksId, labelsId, labels2Id) {
    const NS = 'http://www.w3.org/2000/svg';
    const gT  = document.getElementById(ticksId);
    const gL  = document.getElementById(labelsId);
    const gL2 = document.getElementById(labels2Id);
    if (!gT) return;

    for (let deg = 0; deg <= 180; deg++) {
        const rad = deg * Math.PI / 180;
        const xo = cx + r * Math.cos(rad);
        const yo = cy - r * Math.sin(rad);
        let len = 3;
        if (deg % 5  === 0) len = 5;
        if (deg % 10 === 0) len = 9;
        const xi = cx + (r - len) * Math.cos(rad);
        const yi = cy - (r - len) * Math.sin(rad);
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', xo.toFixed(1)); line.setAttribute('y1', yo.toFixed(1));
        line.setAttribute('x2', xi.toFixed(1)); line.setAttribute('y2', yi.toFixed(1));
        line.setAttribute('stroke', '#1a6070');
        line.setAttribute('stroke-width', deg % 10 === 0 ? '1.4' : deg % 5 === 0 ? '0.9' : '0.5');
        gT.appendChild(line);
    }

    for (let deg = 10; deg <= 170; deg += 10) {
        if (deg === 90) continue;
        const rad = deg * Math.PI / 180;
        const lx = cx + (r - 17) * Math.cos(rad);
        const ly = cy - (r - 17) * Math.sin(rad);
        const txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', lx.toFixed(1));
        txt.setAttribute('y', (ly + 3.5).toFixed(1));
        txt.setAttribute('font-size', r >= 110 ? '9' : '8');
        txt.setAttribute('fill', deg === highlightDeg ? '#e74c3c' : '#1a4a8a');
        txt.setAttribute('font-weight', deg === highlightDeg ? 'bold' : 'normal');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = deg;
        gL.appendChild(txt);
    }

    for (let deg = 10; deg <= 170; deg += 10) {
        if (deg === 90) continue;
        const rad = deg * Math.PI / 180;
        const lx = cx + (r - 27) * Math.cos(rad);
        const ly = cy - (r - 27) * Math.sin(rad);
        const txt = document.createElementNS(NS, 'text');
        txt.setAttribute('x', lx.toFixed(1));
        txt.setAttribute('y', (ly + 3).toFixed(1));
        txt.setAttribute('font-size', r >= 110 ? '8' : '7');
        txt.setAttribute('fill', (180 - deg) === highlightDeg ? '#e74c3c' : '#b03020');
        txt.setAttribute('font-weight', (180 - deg) === highlightDeg ? 'bold' : 'normal');
        txt.setAttribute('text-anchor', 'middle');
        txt.textContent = 180 - deg;
        gL2.appendChild(txt);
    }
}

buildProto(130, 270, 90, 0, 'ticksBR', 'labelsBR', 'labels2BR');
</script>
</body>
</html>
