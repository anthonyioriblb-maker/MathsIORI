<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Somme des angles d'un triangle</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #e3f2fd; border-left: 5px solid #2196f3;
        padding: 12px 18px; margin-bottom: 8px; color: #1565c0;
        font-size: 16px; font-weight: 500; min-height: 54px;
        display: block; line-height: 1.6;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
    }
</style>
</head>
<body>

<div class="step-box"><span id="stepTri">Cliquez sur « Étape suivante » pour voir la démonstration.</span></div>
<div class="svg-wrap">
    <svg id="svgTri" width="540" height="390" viewBox="0 0 540 390" style="max-width:100%; height:auto; background:#fafafa; display:block; margin:0 auto;">

        <!-- Triangle ABC : A=(120,240) B=(420,240) C=(325,35) angles : α=45° β=65° γ=70° -->

        <!-- ─── Groupe 1 : triangle + secteurs colorés ─── -->
        <g id="triGroup" opacity="0">
            <!-- Côtés du triangle -->
            <line x1="120" y1="240" x2="420" y2="240" stroke="black" stroke-width="2.5"/>
            <line x1="120" y1="240" x2="325" y2="35"  stroke="black" stroke-width="2.5"/>
            <line x1="420" y1="240" x2="325" y2="35"  stroke="black" stroke-width="2.5"/>
            <!-- Sommets -->
            <text x="100" y="262" font-size="20" font-weight="bold">A</text>
            <text x="426" y="262" font-size="20" font-weight="bold">B</text>
            <text x="319" y="24"  font-size="20" font-weight="bold">C</text>
            <!-- Secteur α au sommet A (45°, bleu) : sweep=0 CCW → bombé vers l'extérieur -->
            <path d="M 120 240 L 160 240 A 40 40 0 0 0 148 212 Z"
                  fill="rgba(52,152,219,0.35)" stroke="#2980b9" stroke-width="1.5"/>
            <!-- Secteur β au sommet B (65°, vert) : sweep=0 CCW -->
            <path d="M 420 240 L 403 204 A 40 40 0 0 0 380 240 Z"
                  fill="rgba(39,174,96,0.35)" stroke="#27ae60" stroke-width="1.5"/>
            <!-- Secteur γ au sommet C (70°, rouge) : sweep=0 CCW → bombé vers l'intérieur du triangle -->
            <path d="M 325 35 L 297 63 A 40 40 0 0 0 342 71 Z"
                  fill="rgba(231,76,60,0.35)" stroke="#e74c3c" stroke-width="1.5"/>
            <!-- Labels des angles dans le triangle -->
            <text x="170" y="225" font-size="18" fill="#2980b9" font-weight="bold">&#945;</text>
            <text x="368" y="222" font-size="18" fill="#27ae60" font-weight="bold">&#946;</text>
            <text x="310" y="94"  font-size="18" fill="#e74c3c" font-weight="bold">&#947;</text>
        </g>

        <!-- ─── Groupe 2 : structure fixe de la démonstration (ligne + titre) ─── -->
        <g id="demoStructure" opacity="0">
            <text x="270" y="277" font-size="14" fill="#444" text-anchor="middle"
                  font-style="italic">On place les 3 angles c&#244;te &#224; c&#244;te&#160;:</text>
            <!-- Demi-droite représentant l'angle plat -->
            <line x1="210" y1="332" x2="332" y2="332" stroke="#333" stroke-width="2.5"/>
            <polygon points="210,329 203,332 210,335" fill="#333"/>
            <polygon points="332,329 339,332 332,335" fill="#333"/>
        </g>

        <!-- ─── Secteurs animés : glissent depuis A, B, C vers le centre (270,332) ─── -->
        <!-- Centre démo (270,332) r=55 ; décalages de départ : A→(-150,-92) B→(+150,-92) C→(+55,-297) -->
        <g id="animAlpha" opacity="0">
            <!-- sweep=1 (CW sur écran) = arc convexe bombé depuis (270,332) vers le haut-gauche -->
            <path d="M 270 332 L 215 332 A 55 55 0 0 1 231 293 Z"
                  fill="rgba(52,152,219,0.65)" stroke="#2980b9" stroke-width="1.5"/>
            <text x="232" y="320" font-size="16" fill="#1a5276" font-weight="bold">&#945;</text>
        </g>
        <g id="animBeta" opacity="0">
            <!-- sweep=1 = arc convexe bombé vers le haut -->
            <path d="M 270 332 L 231 293 A 55 55 0 0 1 289 280 Z"
                  fill="rgba(39,174,96,0.65)" stroke="#27ae60" stroke-width="1.5"/>
            <text x="257" y="295" font-size="16" fill="#1a7a4a" font-weight="bold">&#946;</text>
        </g>
        <g id="animGamma" opacity="0">
            <!-- sweep=1 = arc convexe bombé vers le haut-droit -->
            <path d="M 270 332 L 289 280 A 55 55 0 0 1 325 332 Z"
                  fill="rgba(231,76,60,0.65)" stroke="#e74c3c" stroke-width="1.5"/>
            <text x="296" y="316" font-size="16" fill="#922b21" font-weight="bold">&#947;</text>
        </g>

        <!-- ─── Groupe 3 : résultat final ─── -->
        <g id="resultTri" opacity="0">
            <text x="270" y="363" font-size="14" fill="#333" text-anchor="middle">= angle plat</text>
            <text x="270" y="387" font-size="22" font-weight="bold" fill="#c0392b"
                  text-anchor="middle">&#945; + &#946; + &#947; = 180&#176;</text>
        </g>

    </svg>
</div>
<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>&#9664; &#201;tape pr&#233;c&#233;dente</button>
    <button class="btn-anim" onclick="nextStep()">&#201;tape suivante &#9654;</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">&#9205; Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer &#8635;</button>
</div>

<script>
const texts = [
    "Cliquez sur &#171;&#160;&#201;tape suivante&#160;&#187; pour voir la d&#233;monstration.",
    "Un triangle ABC poss&#232;de trois angles&#160;: &#945; (bleu en A), &#946; (vert en B) et &#947; (rouge en C).",
    "L&#39;angle &#945; glisse depuis le sommet A et vient se placer sur la droite.",
    "L&#39;angle &#946; glisse depuis le sommet B et se colle contre &#945;.",
    "L&#39;angle &#947; glisse depuis le sommet C et compl&#232;te l&#39;angle plat.",
    "Conclusion&#160;: &#945;&#160;+&#160;&#946;&#160;+&#160;&#947;&#160;=&#160;180&#176;&#160;!"
];
let step = 0;
let autoTimer = null;

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

// slideToDemo : déplace un secteur depuis son sommet vers le centre démo (270,332)
// dx,dy = décalage de départ ; rot = rotation initiale en degrés
function slideToDemo(id, dx, dy, rot) {
    const el = document.getElementById(id);
    el.style.transformOrigin = '270px 332px';
    el.setAttribute('opacity', 1);
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)';
    void el.getBoundingClientRect();
    setTimeout(function() {
        el.style.transition = 'transform 2s cubic-bezier(0.4, 0, 0.2, 1)';
        el.style.transform = 'translate(0,0) rotate(0deg)';
    }, 30);
}

// Applique uniquement les changements introduits en atteignant l'étape n (logique d'origine)
function applyStepChanges(n) {
    document.getElementById('stepTri').innerHTML = texts[n];
    if (n >= 1) setOpacity('triGroup', 1);
    if (n === 2) {
        setOpacity('demoStructure', 1);
        // α depuis A=(120,240) : décalage (-150,-92), rotation +135°
        slideToDemo('animAlpha', -150, -92, 135);
    }
    if (n === 3) {
        // β depuis B=(420,240) : décalage (+150,-92), rotation -45°
        slideToDemo('animBeta', 150, -92, -45);
    }
    if (n === 4) {
        // γ depuis C=(325,35) : décalage (+55,-297), rotation +135°
        slideToDemo('animGamma', 55, -297, 135);
    }
    if (n >= 5) setOpacity('resultTri', 1);
}

function hideAllTri() {
    setOpacity('triGroup', 0);
    setOpacity('demoStructure', 0);
    setOpacity('resultTri', 0);
    ['animAlpha', 'animBeta', 'animGamma'].forEach(function(id) {
        const el = document.getElementById(id);
        el.style.transition = 'none';
        el.style.transform = 'translate(0,0) rotate(0deg)';
        el.setAttribute('opacity', 0);
    });
}

function updateButtons() {
    const btnPrec = document.getElementById('btnPrec');
    if (btnPrec) btnPrec.disabled = (step <= 0);
}

function advanceStep() {
    if (step >= 5) return;
    step++;
    applyStepChanges(step);
    updateButtons();
}

function nextStep() {
    stopAuto();
    advanceStep();
}

function prevStep() {
    stopAuto();
    if (step <= 0) return;
    step--;
    hideAllTri();
    document.getElementById('stepTri').innerHTML = texts[step];
    for (let i = 1; i <= step; i++) applyStepChanges(i);
    updateButtons();
}

function resetAnimation() {
    stopAuto();
    step = 0;
    hideAllTri();
    document.getElementById('stepTri').innerHTML = texts[0];
    updateButtons();
}

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= 5) resetAnimation();
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= 5) { stopAuto(); return; }
        advanceStep();
    }, 2600);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}
</script>
</body>
</html>
