<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Lire l'abscisse d'un point sur une demi-droite graduée</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-anim:disabled { opacity: 0.5; cursor: default; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #e3f2fd; border-left: 5px solid #2196f3;
        padding: 12px 18px; margin-bottom: 8px; color: #1565c0;
        font-size: 16px; font-weight: 500; min-height: 54px;
        display: block; line-height: 1.6;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
    }
    .anim-el { transition: opacity 0.5s ease; }
</style>
</head>
<body>

<div class="step-box"><span id="stepText"></span></div>
<div class="svg-wrap">
    <svg width="640" height="130" viewBox="0 0 640 130" style="max-width:100%; height:auto; background:#fafafa; display:block; margin:0 auto;">
        <line x1="40" y1="80" x2="606" y2="80" stroke="black" stroke-width="2.5"/>
        <polygon points="606,73 622,80 606,87" fill="black"/>
        <!-- Origine O : une croix, jamais un cercle -->
        <line x1="34" y1="74" x2="46" y2="86" stroke="black" stroke-width="2"/><line x1="46" y1="74" x2="34" y2="86" stroke="black" stroke-width="2"/>
        <text x="40" y="52" text-anchor="middle" font-size="20" font-weight="bold">O</text>
        <line x1="150" y1="70" x2="150" y2="90" stroke="black" stroke-width="2"/>
        <text x="150" y="52" text-anchor="middle" font-size="20" font-weight="bold">1</text>
        <line x1="260" y1="70" x2="260" y2="90" stroke="black" stroke-width="2"/>
        <text x="260" y="52" text-anchor="middle" font-size="20" font-weight="bold">2</text>
        <line x1="370" y1="70" x2="370" y2="90" stroke="black" stroke-width="2"/>
        <text x="370" y="52" text-anchor="middle" font-size="20" font-weight="bold">3</text>
        <line x1="480" y1="70" x2="480" y2="90" stroke="black" stroke-width="2"/>
        <text x="480" y="52" text-anchor="middle" font-size="20" font-weight="bold">4</text>
        <line x1="590" y1="70" x2="590" y2="90" stroke="black" stroke-width="2"/>
        <text x="590" y="52" text-anchor="middle" font-size="20" font-weight="bold">5</text>
        <!-- Points B et C -->
        <line x1="187.0" y1="73" x2="201.0" y2="87" stroke="#27ae60" stroke-width="3"/><line x1="201.0" y1="73" x2="187.0" y2="87" stroke="#27ae60" stroke-width="3"/>
        <text x="194.0" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">B</text>
        <line x1="451.0" y1="73" x2="465.0" y2="87" stroke="#27ae60" stroke-width="3"/><line x1="465.0" y1="73" x2="451.0" y2="87" stroke="#27ae60" stroke-width="3"/>
        <text x="458.0" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">C</text>
        <!-- Dixièmes entre 1 et 2 (étape 1) -->
        <g id="tenths1" class="anim-el" opacity="0">
            <line x1="161.0" y1="74" x2="161.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="172.0" y1="74" x2="172.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="183.0" y1="74" x2="183.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="194.0" y1="74" x2="194.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="205.0" y1="74" x2="205.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="216.0" y1="74" x2="216.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="227.0" y1="74" x2="227.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="238.0" y1="74" x2="238.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="249.0" y1="74" x2="249.0" y2="86" stroke="black" stroke-width="1.3"/>
        </g>
        <g id="oneTenth" class="anim-el" opacity="0"><line x1="150" y1="102" x2="161" y2="102" stroke="#e74c3c" stroke-width="4"/><text x="155.5" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">0,1</text></g>
        <g id="fourTenths" class="anim-el" opacity="0"><line x1="150" y1="102" x2="194.0" y2="102" stroke="#e74c3c" stroke-width="4"/><text x="194.0" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">1,4</text></g>
        <!-- Dixièmes entre 3 et 4 (étape 3) -->
        <g id="tenths3" class="anim-el" opacity="0">
            <line x1="381.0" y1="74" x2="381.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="392.0" y1="74" x2="392.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="403.0" y1="74" x2="403.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="414.0" y1="74" x2="414.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="425.0" y1="74" x2="425.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="436.0" y1="74" x2="436.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="447.0" y1="74" x2="447.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="458.0" y1="74" x2="458.0" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="469.0" y1="74" x2="469.0" y2="86" stroke="black" stroke-width="1.3"/>
        </g>
        <g id="eightTenths" class="anim-el" opacity="0"><line x1="370" y1="102" x2="458.0" y2="102" stroke="#e74c3c" stroke-width="4"/><text x="458.0" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">3,8</text></g>
    </svg>
</div>
<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>◀ Étape précédente</button>
    <button class="btn-anim" id="btnNext" onclick="nextStep()">Étape suivante ▶</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">⏵ Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer ↺</button>
</div>

<script>
const STEPS = [
    { text: "Cliquez sur « Étape suivante » pour lire l'abscisse des points B et C." },
    { text: "Étape 1 : B est entre 1 et 2. On partage cette unité en 10 parties égales. Chaque écart représente un dixième : 0,1.", show: ['tenths1', 'oneTenth'] },
    { text: "Étape 2 : B est 4 dixièmes après 1. L'abscisse de B est 1,4 : on note B(1,4).", hide: ['oneTenth'], show: ['fourTenths'] },
    { text: "Étape 3 : C est entre 3 et 4. On partage cette unité en 10 parties égales.", show: ['tenths3'] },
    { text: "Étape 4 : C est 8 dixièmes après 3. L'abscisse de C est 3,8 : on note C(3,8).", show: ['eightTenths'] }
];
const LAST = STEPS.length - 1;
let step = 0;
let autoTimer = null;

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

// Applique uniquement la nouveauté de l'étape n
function applyStepChanges(n) {
    document.getElementById('stepText').innerHTML = STEPS[n].text;
    (STEPS[n].hide || []).forEach(id => setOpacity(id, 0));
    (STEPS[n].show || []).forEach(id => setOpacity(id, 1));
}

function hideAll() {
    document.querySelectorAll('.anim-el').forEach(el => el.setAttribute('opacity', 0));
}

function updateButtons() {
    document.getElementById('btnPrec').disabled = (step <= 0);
    document.getElementById('btnNext').disabled = (step >= LAST);
}

function advanceStep() {
    if (step >= LAST) return;
    step++;
    applyStepChanges(step);
    updateButtons();
}

// Reconstruit instantanément l'état visuel de l'étape n (utilisé par « précédent »)
function renderStep(n) {
    if (n < 0) n = 0;
    if (n > LAST) n = LAST;
    hideAll();
    for (let i = 0; i <= n; i++) applyStepChanges(i);
    step = n;
    updateButtons();
}

function nextStep() { stopAuto(); advanceStep(); }
function prevStep() { stopAuto(); if (step > 0) renderStep(step - 1); }
function resetAnimation() { stopAuto(); renderStep(0); }

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= LAST) renderStep(0);
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= LAST) { stopAuto(); return; }
        advanceStep();
    }, 2800);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}

renderStep(0);
</script>
<script>
/* === Redimensionnement automatique (hauteur) === */
(function () {
    if (window.parent === window) return;
    function postH() {
        window.parent.postMessage({ type: 'iframe-resize', height: document.body.scrollHeight }, '*');
    }
    if (window.ResizeObserver) new ResizeObserver(postH).observe(document.body);
    window.addEventListener('load', postH);
    if (document.readyState !== 'loading') postH(); else document.addEventListener('DOMContentLoaded', postH);
})();
</script>
</body>
</html>
