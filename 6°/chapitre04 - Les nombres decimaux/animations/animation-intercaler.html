<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intercaler un nombre décimal – selon le rang des chiffres</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f8;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 30px;
}

.wrap {
  background: white; border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  padding: 24px; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  margin-bottom: 14px;
}

.nombres-row { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; justify-content: center; }

.nombre-bloc {
  display: flex; align-items: flex-end; gap: 0;
  padding: 10px 18px; background: #f5f5f5;
  border-radius: 10px; border: 3px solid #ddd;
  transition: all 0.4s; justify-content: center;
}
.nombre-bloc.resultat { border-color: #4caf50; background: #e8f5e9; opacity: 0; transition: all 0.4s; }
.nombre-bloc.resultat.visible { opacity: 1; }

.chiffre-box { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; }
.chiffre-val {
  font-size: 2.2rem; font-weight: bold; color: #333;
  width: 44px; text-align: center; line-height: 1;
  transition: all 0.35s; border-radius: 6px; padding: 2px;
}
.chiffre-val.hl-equal { background: #fff3b8; color: #333; }
.chiffre-val.hl-a { background: #2196f3; color: white; transform: scale(1.15); box-shadow: 0 3px 8px rgba(33,150,243,0.4); }
.chiffre-val.hl-b { background: #e53935; color: white; transform: scale(1.15); box-shadow: 0 3px 8px rgba(229,57,53,0.4); }
.chiffre-val.hl-milieu { background: #4caf50; color: white; transform: scale(1.15); box-shadow: 0 3px 8px rgba(76,175,80,0.4); }
.chiffre-label { font-size: 0.62rem; color: #999; margin-top: 3px; font-weight: 600; }

.virgule { font-size: 2.2rem; font-weight: bold; color: #333; margin: 0 2px 18px; }

.signe { font-size: 1.6rem; font-weight: bold; color: #555; }

.remarque-anim {
  font-size: 0.9rem; color: #555; text-align: center; max-width: 520px;
  opacity: 0; transition: opacity 0.5s;
}
.remarque-anim.visible { opacity: 1; }

.step-box {
  background: #e3f2fd; border-left: 5px solid #2196f3;
  padding: 14px 20px; border-radius: 0 8px 8px 0;
  font-size: 1rem; color: #1565c0; width: 100%;
  min-height: 52px; display: block; line-height: 1.6;
  font-weight: 500; margin-bottom: 14px;
}

.progress-bar-wrap { width: 100%; background: #e0e0e0; border-radius: 8px; height: 8px; margin-bottom: 14px; overflow: hidden; }
.progress-bar { height: 8px; background: linear-gradient(90deg, #2196f3, #4caf50); border-radius: 8px; width: 0%; transition: width 0.4s; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  padding: 11px 22px; border: none; border-radius: 8px;
  font-size: 0.95rem; font-weight: bold; cursor: pointer;
  transition: all 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
button:hover { transform: translateY(-2px); }
button:disabled { background: #bdbdbd !important; color: #fff; cursor: not-allowed; transform: none; }
#btnReset { background: #f44336; color: white; }
#btnPrev  { background: #ff9800; color: white; }
#btnNext  { background: #2196f3; color: white; }
#btnAuto  { background: #4caf50; color: white; }
</style>
</head>
<body>

<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="wrap">
  <div class="nombres-row">
    <div class="nombre-bloc" id="blocA">
      <div class="chiffre-box"><div class="chiffre-val" id="cA0">4</div><div class="chiffre-label">unités</div></div>
      <div class="virgule">,</div>
      <div class="chiffre-box"><div class="chiffre-val" id="cA1">1</div><div class="chiffre-label">dixièmes</div></div>
    </div>
    <div class="signe">&lt; ... &lt;</div>
    <div class="nombre-bloc" id="blocB">
      <div class="chiffre-box"><div class="chiffre-val" id="cB0">4</div><div class="chiffre-label">unités</div></div>
      <div class="virgule">,</div>
      <div class="chiffre-box"><div class="chiffre-val" id="cB1">3</div><div class="chiffre-label">dixièmes</div></div>
    </div>
  </div>

  <div class="nombre-bloc resultat" id="blocR">
    <div class="chiffre-box"><div class="chiffre-val" id="cR0">4</div><div class="chiffre-label">unités</div></div>
    <div class="virgule">,</div>
    <div class="chiffre-box"><div class="chiffre-val" id="cR1">2</div><div class="chiffre-label">dixièmes</div></div>
  </div>

  <div class="remarque-anim" id="remarque">D'autres réponses conviennent aussi : par exemple 4,15 ou 4,25 (en ajoutant un chiffre des centièmes).</div>
</div>

<div class="step-box" id="stepBox"></div>

<div class="controls">
  <button id="btnReset" onclick="reset()">↺ Recommencer</button>
  <button id="btnPrev"  onclick="prev()" disabled>◀ Précédente</button>
  <button id="btnNext"  onclick="next()">Suivante ▶</button>
  <button id="btnAuto"  onclick="toggleAuto()">⏵ Automatique</button>
</div>

<script>
const steps = [
  {
    msg: '<strong>Intercaler un nombre</strong>, c\'est trouver un nombre décimal entre deux nombres donnés : ici entre <strong>4,1</strong> et <strong>4,3</strong>.',
    show: 'none'
  },
  {
    msg: 'On compare rang par rang : les <strong>unités</strong> sont égales (4 = 4).',
    show: 'equal'
  },
  {
    msg: 'Au rang des <strong>dixièmes</strong> : 4,1 a un <strong>1</strong>, 4,3 a un <strong>3</strong>. Il reste de la place pour un chiffre entre les deux : le <strong>2</strong>.',
    show: 'dixiemes'
  },
  {
    msg: '✅ <strong>4,1 &lt; 4,2 &lt; 4,3</strong> : 4,2 convient.',
    show: 'resultat'
  },
  {
    msg: 'Quand il n\'y a plus de place au rang des dixièmes (nombres qui se suivent), on ajoute un rang de plus (centièmes) pour trouver de la place.',
    show: 'remarque'
  }
];

let etape = -1, autoMode = false, autoTimer = null;

function clearAll() {
  ['cA0','cA1','cB0','cB1'].forEach(id => document.getElementById(id).className = 'chiffre-val');
  document.getElementById('blocR').classList.remove('visible');
  document.getElementById('remarque').classList.remove('visible');
}

function applyStep(i) {
  const s = steps[i];
  document.getElementById('stepBox').innerHTML = s.msg;
  document.getElementById('progressBar').style.width = ((i + 1) / steps.length * 100) + '%';
  document.getElementById('btnPrev').disabled = (i <= 0);
  document.getElementById('btnNext').disabled = (i >= steps.length - 1);

  clearAll();

  if (s.show === 'equal' || s.show === 'dixiemes' || s.show === 'resultat' || s.show === 'remarque') {
    document.getElementById('cA0').classList.add('hl-equal');
    document.getElementById('cB0').classList.add('hl-equal');
  }
  if (s.show === 'dixiemes' || s.show === 'resultat' || s.show === 'remarque') {
    document.getElementById('cA1').classList.add('hl-a');
    document.getElementById('cB1').classList.add('hl-b');
  }
  if (s.show === 'resultat' || s.show === 'remarque') {
    document.getElementById('blocR').classList.add('visible');
    document.getElementById('cR1').classList.add('hl-milieu');
  }
  if (s.show === 'remarque') {
    document.getElementById('remarque').classList.add('visible');
    stopAuto();
  }
}

function reset() {
  stopAuto(); etape = -1;
  document.getElementById('stepBox').innerHTML = '';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnNext').disabled = false;
  clearAll();
}

function next() {
  if (etape < steps.length - 1) { etape++; applyStep(etape); }
  if (etape >= steps.length - 1) stopAuto();
}
function prev() {
  if (etape > 0) { etape--; applyStep(etape); }
}

function toggleAuto() {
  if (autoMode) { stopAuto(); return; }
  autoMode = true;
  document.getElementById('btnAuto').textContent = '⏸ Pause';
  document.getElementById('btnAuto').style.background = '#ff9800';
  autoTimer = setInterval(() => { if (etape >= steps.length - 1) { stopAuto(); } else { next(); } }, 2400);
}
function stopAuto() {
  autoMode = false; clearInterval(autoTimer); autoTimer = null;
  document.getElementById('btnAuto').textContent = '⏵ Automatique';
  document.getElementById('btnAuto').style.background = '#4caf50';
}
</script>
</body>
</html>
