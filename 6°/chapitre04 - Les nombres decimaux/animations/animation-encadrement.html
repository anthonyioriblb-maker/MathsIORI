<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encadrer un nombre décimal – selon le rang des chiffres</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f8;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 30px;
}

.wrap {
  background: white; border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  padding: 24px; width: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  margin-bottom: 14px;
}

.nombre-bloc {
  display: flex; align-items: flex-end; gap: 0;
  padding: 10px 18px; background: #f5f5f5;
  border-radius: 10px; border: 3px solid #ddd;
  transition: all 0.4s; justify-content: center;
}

.chiffre-box { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; }
.chiffre-val {
  font-size: 2.2rem; font-weight: bold; color: #333;
  width: 44px; text-align: center; line-height: 1;
  transition: all 0.35s; border-radius: 6px; padding: 2px;
}
.chiffre-val.hl { background: #2196f3; color: white; transform: scale(1.15); box-shadow: 0 3px 8px rgba(33,150,243,0.4); }
.chiffre-val.fade { opacity: 0.25; }
.chiffre-label { font-size: 0.62rem; color: #999; margin-top: 3px; font-weight: 600; }

.virgule { font-size: 2.2rem; font-weight: bold; color: #333; margin: 0 2px 18px; }

.encadrement-row {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
}
.borne {
  font-size: 1.6rem; font-weight: bold; color: #333;
  padding: 6px 16px; border-radius: 8px; background: #f5f5f5;
  opacity: 0; transition: opacity 0.4s;
}
.borne.visible { opacity: 1; }
.borne.min { color: #4caf50; }
.borne.max { color: #e53935; }
.signe { font-size: 1.4rem; color: #555; }

.step-box {
  background: #e3f2fd; border-left: 5px solid #2196f3;
  padding: 14px 20px; border-radius: 0 8px 8px 0;
  font-size: 1rem; color: #1565c0; width: 100%;
  min-height: 52px; display: block; line-height: 1.6;
  font-weight: 500; margin-bottom: 14px;
}

.progress-bar-wrap { width: 100%; background: #e0e0e0; border-radius: 8px; height: 8px; margin-bottom: 14px; overflow: hidden; }
.progress-bar { height: 8px; background: linear-gradient(90deg, #2196f3, #4caf50); border-radius: 8px; width: 0%; transition: width 0.4s; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  padding: 11px 22px; border: none; border-radius: 8px;
  font-size: 0.95rem; font-weight: bold; cursor: pointer;
  transition: all 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
button:hover { transform: translateY(-2px); }
button:disabled { background: #bdbdbd !important; color: #fff; cursor: not-allowed; transform: none; }
#btnReset { background: #f44336; color: white; }
#btnPrev  { background: #ff9800; color: white; }
#btnNext  { background: #2196f3; color: white; }
#btnAuto  { background: #4caf50; color: white; }
</style>
</head>
<body>

<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="wrap">
  <div class="nombre-bloc" id="bloc">
    <div class="chiffre-box"><div class="chiffre-val" id="c0">2</div><div class="chiffre-label">unités</div></div>
    <div class="virgule">,</div>
    <div class="chiffre-box"><div class="chiffre-val" id="c1">9</div><div class="chiffre-label">dixièmes</div></div>
    <div class="chiffre-box"><div class="chiffre-val" id="c2">8</div><div class="chiffre-label">centièmes</div></div>
    <div class="chiffre-box"><div class="chiffre-val" id="c3">8</div><div class="chiffre-label">millièmes</div></div>
    <div class="chiffre-box"><div class="chiffre-val" id="c4">8</div><div class="chiffre-label">dix-millièmes</div></div>
  </div>

  <div class="encadrement-row">
    <div class="borne min" id="borneMin">2</div>
    <div class="signe">&lt;</div>
    <div class="borne visible" id="borneCentre">2,9888</div>
    <div class="signe">&lt;</div>
    <div class="borne max" id="borneMax">3</div>
  </div>
</div>

<div class="step-box" id="stepBox"></div>

<div class="controls">
  <button id="btnReset" onclick="reset()">↺ Recommencer</button>
  <button id="btnPrev"  onclick="prev()" disabled>◀ Précédente</button>
  <button id="btnNext"  onclick="next()">Suivante ▶</button>
  <button id="btnAuto"  onclick="toggleAuto()">⏵ Automatique</button>
</div>

<script>
const steps = [
  {
    msg: 'Voici le nombre <strong>2,9888</strong> décomposé selon le <strong>rang</strong> de chacun de ses chiffres.',
    keep: [], min: '', max: ''
  },
  {
    msg: 'Encadrement à l\'<strong>unité</strong> : on garde seulement le chiffre des <strong>unités</strong>. La borne du bas, c\'est ce chiffre ; la borne du haut, c\'est ce même chiffre <strong>+ 1</strong>.',
    keep: [0], min: '2', max: '3'
  },
  {
    msg: 'Encadrement au <strong>dixième</strong> : on garde les chiffres jusqu\'aux <strong>dixièmes</strong>. La borne du haut s\'obtient en ajoutant 1 au rang des dixièmes.',
    keep: [0,1], min: '2,9', max: '3,0'
  },
  {
    msg: 'Encadrement au <strong>centième</strong> : on garde les chiffres jusqu\'aux <strong>centièmes</strong>.',
    keep: [0,1,2], min: '2,98', max: '2,99'
  },
  {
    msg: '✅ Plus on garde de rangs, plus l\'encadrement est <strong>précis</strong> : l\'écart entre les deux bornes devient de plus en plus petit.',
    keep: [0,1,2], min: '2,98', max: '2,99'
  }
];

let etape = -1, autoMode = false, autoTimer = null;
const allIds = ['c0','c1','c2','c3','c4'];

function applyStep(i) {
  const s = steps[i];
  document.getElementById('stepBox').innerHTML = s.msg;
  document.getElementById('progressBar').style.width = ((i + 1) / steps.length * 100) + '%';
  document.getElementById('btnPrev').disabled = (i <= 0);
  document.getElementById('btnNext').disabled = (i >= steps.length - 1);

  allIds.forEach((id, idx) => {
    const el = document.getElementById(id);
    el.className = 'chiffre-val';
    if (s.keep.length === 0) return;
    if (s.keep.includes(idx)) el.classList.add('hl');
    else el.classList.add('fade');
  });

  const borneMin = document.getElementById('borneMin');
  const borneMax = document.getElementById('borneMax');
  borneMin.textContent = s.min;
  borneMax.textContent = s.max;
  borneMin.classList.toggle('visible', s.min !== '');
  borneMax.classList.toggle('visible', s.max !== '');

  if (i >= steps.length - 1) stopAuto();
}

function reset() {
  stopAuto(); etape = -1;
  document.getElementById('stepBox').innerHTML = '';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnNext').disabled = false;
  allIds.forEach(id => document.getElementById(id).className = 'chiffre-val');
  document.getElementById('borneMin').classList.remove('visible');
  document.getElementById('borneMax').classList.remove('visible');
}

function next() {
  if (etape < steps.length - 1) { etape++; applyStep(etape); }
  if (etape >= steps.length - 1) stopAuto();
}
function prev() {
  if (etape > 0) { etape--; applyStep(etape); }
}

function toggleAuto() {
  if (autoMode) { stopAuto(); return; }
  autoMode = true;
  document.getElementById('btnAuto').textContent = '⏸ Pause';
  document.getElementById('btnAuto').style.background = '#ff9800';
  autoTimer = setInterval(() => { if (etape >= steps.length - 1) { stopAuto(); } else { next(); } }, 2400);
}
function stopAuto() {
  autoMode = false; clearInterval(autoTimer); autoTimer = null;
  document.getElementById('btnAuto').textContent = '⏵ Automatique';
  document.getElementById('btnAuto').style.background = '#4caf50';
}
</script>
</body>
</html>
