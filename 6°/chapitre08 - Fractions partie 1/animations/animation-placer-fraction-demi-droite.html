<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation : Placer une fraction sur une demi-droite graduée</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        padding: 10px;
    }
    .btn-anim {
        background: #2196f3; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-anim:hover { background: #1565c0; }
    .btn-reset {
        background: #e74c3c; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-reset:hover { background: #c0392b; }
    .btn-auto {
        background: #4caf50; color: white; border: none;
        padding: 10px 22px; border-radius: 6px; font-size: 16px;
        cursor: pointer; margin: 4px;
    }
    .btn-auto:hover { background: #388e3c; }
    .step-box {
        background: #e3f2fd; border-left: 5px solid #2196f3;
        padding: 12px 18px; margin-bottom: 8px; color: #1565c0;
        font-size: 16px; font-weight: 500; min-height: 54px;
        display: block; line-height: 1.6;
    }
    .svg-wrap {
        text-align: center; background: white; padding: 6px;
        border-radius: 5px; border: 2px solid #ddd;
    }
    /* Fraction en écriture verticale (copiée de styles.css) */
    .fraction {
        display: inline-block;
        margin-left: .1em;
        margin-right: .1em;
        vertical-align: middle;
        text-align: center;
    }
    .fraction > .numerateur {
        display: block;
        padding: 0 .1em;
        border-bottom: 1px solid black;
        padding-bottom: 2px;
    }
    .fraction > .denominateur {
        display: block;
        padding: 0 .1em;
        padding-top: 2px;
    }

    #fifthsUnit1, #firstFifth, #fifthsUnit2, #fullBracket, #pointA {
        transition: opacity 0.5s ease;
    }
</style>
</head>
<body>

<div class="step-box"><span id="stepFrac">Cliquez sur « Étape suivante » pour voir comment placer A(<span class="fraction"><span class="numerateur">7</span><span class="denominateur">5</span></span>) sur cette demi-droite graduée.</span></div>
<div class="svg-wrap">
    <svg id="svgFrac" width="620" height="130" viewBox="0 0 620 130" style="max-width:100%; height:auto; background:#fafafa; display:block; margin:0 auto;">

        <!-- Ligne principale + flèche -->
        <line x1="60" y1="80" x2="590" y2="80" stroke="black" stroke-width="2.5"/>
        <polygon points="590,73 606,80 590,87" fill="black"/>

        <!-- Origine O : une croix, jamais un cercle -->
        <line x1="54" y1="74" x2="66" y2="86" stroke="black" stroke-width="2"/>
        <line x1="66" y1="74" x2="54" y2="86" stroke="black" stroke-width="2"/>
        <text x="60" y="52" text-anchor="middle" font-size="20" font-weight="bold">O</text>

        <!-- Graduations majeures (unités) -->
        <line x1="160" y1="70" x2="160" y2="90" stroke="black" stroke-width="2"/>
        <text x="160" y="52" text-anchor="middle" font-size="20" font-weight="bold">1</text>
        <line x1="260" y1="70" x2="260" y2="90" stroke="black" stroke-width="2"/>
        <line x1="360" y1="70" x2="360" y2="90" stroke="black" stroke-width="2"/>
        <line x1="460" y1="70" x2="460" y2="90" stroke="black" stroke-width="2"/>

        <!-- Graduations en cinquièmes entre O et 1 (étape 1) -->
        <g id="fifthsUnit1" opacity="0">
            <line x1="80"  y1="74" x2="80"  y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="100" y1="74" x2="100" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="120" y1="74" x2="120" y2="86" stroke="black" stroke-width="1.3"/>
            <line x1="140" y1="74" x2="140" y2="86" stroke="black" stroke-width="1.3"/>
        </g>

        <!-- Premier cinquième surligné en rouge (étape 1) -->
        <line id="firstFifth" x1="60" y1="102" x2="80" y2="102" stroke="#e74c3c" stroke-width="4" opacity="0"/>

        <!-- Graduation en cinquièmes entre 1 et A (étape 2) -->
        <g id="fifthsUnit2" opacity="0">
            <line x1="180" y1="74" x2="180" y2="86" stroke="black" stroke-width="1.3"/>
        </g>

        <!-- Report complet de O à A = 7 cinquièmes (étape 2), remplace firstFifth -->
        <line id="fullBracket" x1="60" y1="102" x2="200" y2="102" stroke="#e74c3c" stroke-width="4" opacity="0"/>

        <!-- Point A (étape 2) -->
        <g id="pointA" opacity="0">
            <line x1="200" y1="70" x2="200" y2="90" stroke="#27ae60" stroke-width="3"/>
            <text x="200" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">A</text>
        </g>

    </svg>
</div>
<div style="text-align:center; margin-top:10px;">
    <button class="btn-anim" id="btnPrec" onclick="prevStep()" disabled>◀ Étape précédente</button>
    <button class="btn-anim" onclick="nextStep()">Étape suivante ▶</button>
    <button class="btn-auto" id="btnAuto" onclick="toggleAuto()">⏵ Automatique</button>
    <button class="btn-reset" onclick="resetAnimation()">Recommencer ↺</button>
</div>

<script>
const texts = [
    "Cliquez sur « Étape suivante » pour voir comment placer A(<span class='fraction'><span class='numerateur'>7</span><span class='denominateur'>5</span></span>) sur cette demi-droite graduée.",
    "Étape 1 : On partage l'unité en 5 parties égales. Chaque écart représente <span class='fraction'><span class='numerateur'>1</span><span class='denominateur'>5</span></span>.",
    "Étape 2 : On reporte 7 fois la longueur du cinquième de l'unité. Le point A(<span class='fraction'><span class='numerateur'>7</span><span class='denominateur'>5</span></span>) est placé !"
];
let step = 0;
let autoTimer = null;

function setOpacity(id, v) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('opacity', v);
}

// Applique uniquement la nouveauté de l'étape n (logique d'origine)
function applyStepChanges(n) {
    document.getElementById('stepFrac').innerHTML = texts[n];
    if (n === 1) {
        setOpacity('fifthsUnit1', 1);
        setOpacity('firstFifth', 1);
    }
    if (n >= 2) {
        setOpacity('firstFifth', 0);
        setOpacity('fifthsUnit2', 1);
        setOpacity('fullBracket', 1);
        setOpacity('pointA', 1);
    }
}

function hideAllFrac() {
    ['fifthsUnit1','firstFifth','fifthsUnit2','fullBracket','pointA'].forEach(id => setOpacity(id, 0));
}

function updateButtons() {
    const btnPrec = document.getElementById('btnPrec');
    if (btnPrec) btnPrec.disabled = (step <= 0);
}

function advanceStep() {
    if (step >= 2) return;
    step++;
    applyStepChanges(step);
    updateButtons();
}

// Reconstruit intégralement l'état visuel pour l'étape n (utilisé par « précédent »)
function goToStep(n) {
    if (n < 0) n = 0;
    if (n > 2) n = 2;
    hideAllFrac();
    document.getElementById('stepFrac').innerHTML = texts[0];
    for (let i = 1; i <= n; i++) applyStepChanges(i);
    step = n;
    updateButtons();
}

function nextStep() {
    stopAuto();
    advanceStep();
}

function prevStep() {
    stopAuto();
    if (step > 0) goToStep(step - 1);
}

function resetAnimation() {
    stopAuto();
    hideAllFrac();
    step = 0;
    document.getElementById('stepFrac').innerHTML = texts[0];
    updateButtons();
}

function toggleAuto() {
    const btn = document.getElementById('btnAuto');
    if (autoTimer) { stopAuto(); return; }
    if (step >= 2) resetAnimation();
    btn.textContent = '⏸ Pause';
    btn.style.background = '#ff9800';
    autoTimer = setInterval(() => {
        if (step >= 2) { stopAuto(); return; }
        advanceStep();
    }, 2600);
}

function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    const btn = document.getElementById('btnAuto');
    if (btn) { btn.textContent = '⏵ Automatique'; btn.style.background = ''; }
}
</script>
</body>
</html>
